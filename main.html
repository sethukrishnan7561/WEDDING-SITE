<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Memories For Ever - Leni & Jackson</title>
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #dfc194;
      --primary-hover: #edd3a9;
      --bg-dark: #0f1115;
      --card-bg: #161920;
      --text: #f3f4f6;
      --text-muted: #9ca3af;
      --border: #2a2f3d;
      --danger: #ef4444;
      --success: #10b981;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body {
      background-color: var(--bg-dark);
      background-image: linear-gradient(rgba(15, 17, 21, 0.88), rgba(15, 17, 21, 0.92)), 
                        url('https://images.unsplash.com/photo-1519741497674-611481863552?auto=format&fit=crop&w=1920&q=80');
      background-size: cover; background-position: center; background-attachment: fixed;
      color: var(--text); line-height: 1.6; min-height: 100vh; display: flex; flex-direction: column;
    }

    /* 3-Column Header */
    header {
      background: rgba(22, 25, 32, 0.85); backdrop-filter: blur(10px);
      padding: 1rem 2rem; display: grid; grid-template-columns: 1fr auto 1fr;
      align-items: center; border-bottom: 1px solid var(--border);
      position: relative; z-index: 50;
    }

    .header-left { justify-self: start; }
    .album-title { font-family: 'Great Vibes', cursive; font-size: 2rem; color: #ffffff; }
    .brand-center { font-family: 'Great Vibes', cursive; font-size: 2.2rem; color: var(--primary); text-align: center; }
    .header-right { justify-self: end; }

    /* Admin Button: HIDDEN by default from public */
    .btn-admin {
      display: none;
      background: var(--primary); color: #0f1115; border: none;
      padding: 0.5rem 1.1rem; border-radius: 6px; font-size: 0.85rem;
      font-weight: 600; cursor: pointer; align-items: center; gap: 0.6rem;
    }
    .btn-admin:hover { background: var(--primary-hover); }

    .sync-indicator-dot {
      width: 10px; height: 10px; border-radius: 50%;
      background-color: var(--danger);
      box-shadow: 0 0 8px rgba(239, 68, 68, 0.9);
      display: inline-block;
    }
    .sync-indicator-dot.connected {
      background-color: var(--success);
      box-shadow: 0 0 8px rgba(16, 185, 129, 0.9);
    }

    .container { max-width: 1400px; margin: 2.5rem auto; padding: 0 1.5rem; flex-grow: 1; width: 100%; }

    /* Banner Slideshow */
    .banner-section {
      position: relative; width: 100%; height: 560px; border-radius: 12px;
      overflow: hidden; margin-bottom: 2rem; box-shadow: 0 12px 40px rgba(0, 0, 0, 0.6);
      border: 1px solid var(--border); display: flex; justify-content: center;
      align-items: flex-end; padding-bottom: 3rem;
    }
    .banner-slide {
      position: absolute; inset: 0; background-size: cover; background-position: center;
      opacity: 0; transition: opacity 1.2s ease-in-out; filter: brightness(0.85);
    }
    .banner-slide.active { opacity: 1; }

    .btn-search-memories {
      position: relative; z-index: 10; background: #ffffff; color: #2563eb;
      font-family: 'Great Vibes', cursive; font-size: 2rem; padding: 0.6rem 2.5rem;
      border-radius: 35px; border: 1px solid #bfdbfe; cursor: pointer;
      box-shadow: 0 6px 20px rgba(0,0,0,0.4);
    }

    /* 4-Column Reel-Style Grid Section (Strict 9:12 aspect ratio container) */
    .reel-grid-section {
      display: grid; grid-template-columns: repeat(4, 1fr); gap: 1.5rem; margin-bottom: 3rem; width: 100%;
    }
    @media (max-width: 1024px) { .reel-grid-section { grid-template-columns: repeat(2, 1fr); } }
    @media (max-width: 640px) { .reel-grid-section { grid-template-columns: 1fr; } }

    .reel-card {
      background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px;
      overflow: hidden; display: flex; flex-direction: column;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4); position: relative;
    }
    .reel-container {
      width: 100%;
      aspect-ratio: 9 / 12;
      background-color: #000; position: relative; overflow: hidden;
    }
    .reel-slider-track {
      display: flex; width: 100%; height: 100%; transition: transform 1.2s ease-in-out;
    }
    .reel-slide {
      min-width: 100%; height: 100%; object-fit: cover; flex-shrink: 0;
    }

    /* Integrated Custom Player Options Overlay */
    .custom-player-controls {
      position: absolute; bottom: 0; left: 0; width: 100%;
      background: linear-gradient(transparent, rgba(0, 0, 0, 0.85));
      padding: 12px 10px 8px; display: flex; flex-direction: column; gap: 6px;
      opacity: 0; transition: opacity 0.3s ease-in-out; z-index: 10;
    }
    .reel-card:hover .custom-player-controls { opacity: 1; }

    .video-progress-bar {
      width: 100%; height: 4px; background: rgba(255,255,255,0.3); border-radius: 2px; cursor: pointer; position: relative;
    }
    .video-progress-filled {
      height: 100%; background: var(--primary); width: 0%; border-radius: 2px;
    }
    .controls-row {
      display: flex; justify-content: space-between; align-items: center; color: #fff; font-size: 0.75rem;
    }
    .controls-left, .controls-right { display: flex; align-items: center; gap: 8px; }
    .control-btn {
      background: none; border: none; color: #fff; cursor: pointer; font-size: 0.9rem; padding: 2px;
    }
    .control-btn:hover { color: var(--primary); }

    /* Grid */
    .album-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1.5rem; }
    @media (max-width: 1024px) { .album-grid { grid-template-columns: repeat(2, 1fr); } }
    @media (max-width: 640px) { .album-grid { grid-template-columns: 1fr; } }

    .album-card {
      background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px;
      overflow: hidden; display: flex; flex-direction: column; justify-content: space-between;
      text-align: center;
    }
    .cover-container { width: 100%; height: 200px; background-color: #1f2430; }
    .folder-cover-preview { width: 100%; height: 100%; object-fit: cover; }
    .card-content { padding: 1.1rem 1rem; }
    .album-details h3 { font-size: 1.15rem; color: var(--text); font-family: "Georgia", serif; margin-bottom: 0.9rem; }

    .btn {
      background: var(--primary); color: #0f1115; padding: 0.55rem 0.75rem;
      border-radius: 6px; font-size: 0.85rem; font-weight: 600; cursor: pointer; border: none; width: 100%;
    }

    /* Gallery View */
    .view-section { display: none; }
    .view-header {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 1.5rem; border-bottom: 1px solid var(--border); padding-bottom: 1rem;
    }
    .folder-heading { font-family: "Georgia", serif; font-size: 2rem; color: #ffffff; }

    .action-bar { display: flex; gap: 0.75rem; }
    .btn-secondary { background: transparent; color: var(--text); border: 1px solid var(--border); width: auto; padding: 0.5rem 1rem; }
    .btn-upload-admin { display: none; width: auto; padding: 0.5rem 1rem; }

    .photo-grid { display: flex; gap: 1.5rem; overflow-x: auto; padding-bottom: 1.5rem; }
    .photo-card {
      background: var(--card-bg); border: 1px solid var(--border); border-radius: 8px;
      overflow: hidden; min-width: 240px; max-width: 240px; flex-shrink: 0;
    }
    .photo-card img { width: 100%; height: 160px; object-fit: cover; cursor: pointer; }
    .photo-footer { padding: 0.6rem; display: flex; justify-content: space-between; align-items: center; }
    .photo-title { font-size: 0.75rem; color: var(--text-muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 140px; }
    .btn-delete-admin { display: none; background: rgba(239, 68, 68, 0.2); color: var(--danger); border: 1px solid var(--danger); padding: 0.2rem 0.5rem; border-radius: 4px; cursor: pointer; }

    /* Modals */
    .modal {
      display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8);
      backdrop-filter: blur(5px); justify-content: center; align-items: center; z-index: 1000;
    }
    .modal-content {
      background: var(--card-bg); border: 1px solid var(--border);
      padding: 2rem; border-radius: 12px; width: 100%; max-width: 440px;
    }
    .modal-content input {
      width: 100%; padding: 0.7rem; margin-top: 0.25rem; margin-bottom: 1rem;
      background: #0f1115; border: 1px solid var(--border); color: white; border-radius: 6px;
    }
    .modal-actions { display: flex; justify-content: flex-end; gap: 0.75rem; }
  </style>
</head>
<body>

  <header>
    <div class="header-left"><div class="album-title">Leni & Jackson</div></div>
    <div class="brand-center">Memories For Ever</div>
    <div class="header-right">
      <button class="btn-admin" id="btnAdmin" onclick="openAdminPanel()">
        Admin Panel
        <span class="sync-indicator-dot" id="syncDot"></span>
      </button>
    </div>
  </header>

  <main class="container">
    <div id="home-view" class="view-section" style="display: block;">
      <!-- Original Banner Slideshow[cite: 1] -->
      <div class="banner-section">
        <div class="banner-slide active" style="background-image: url('family.jpg');"></div>
        <div class="banner-slide" style="background-image: url('cover.jpg');"></div>
        <div class="banner-slide" style="background-image: url('family2.jpg');"></div>
        <button class="btn-search-memories" onclick="document.getElementById('folder-grid').scrollIntoView({behavior:'smooth'})">Search Memories</button>
      </div>

      <!-- 4-Column Reel-Style Grid Section with Manual Video Linking -->
      <div class="reel-grid-section" id="reelGridSection"></div>

      <div class="album-grid" id="folder-grid"></div>
    </div>

    <div id="gallery-view" class="view-section">
      <div class="view-header">
        <h2 class="folder-heading" id="current-folder-title">Folder</h2>
        <div class="action-bar">
          <button class="btn btn-secondary" onclick="goHome()">🏠 Home</button>
          <button class="btn btn-upload-admin" id="btnUploadAdmin" onclick="openAddModal()">Upload</button>
        </div>
      </div>
      <div id="photo-grid" class="photo-grid"></div>
    </div>
  </main>

  <!-- Upload Modal -->
  <div id="addModal" class="modal">
    <div class="modal-content">
      <h3>Upload Photo to GitHub</h3>
      <input type="text" id="imgTitleInput" placeholder="Photo Title">
      <input type="file" id="fileInput" accept="image/*">
      <div class="modal-actions">
        <button class="btn btn-secondary" onclick="document.getElementById('addModal').style.display='none'">Cancel</button>
        <button class="btn" id="btnSubmitUpload" onclick="uploadPhotoToGitHub()">Upload & Push</button>
      </div>
    </div>
  </div>

  <!-- Admin Credentials Modal -->
  <div id="adminPanelModal" class="modal">
    <div class="modal-content">
      <h3>Admin GitHub Sync</h3>
      <label style="font-size: 0.8rem; color: var(--text-muted);">Repository Username</label>
      <input type="text" id="ghOwner" placeholder="e.g. your-github-username">
      <label style="font-size: 0.8rem; color: var(--text-muted);">Repository Name</label>
      <input type="text" id="ghRepo" placeholder="e.g. wedding-website">
      <label style="font-size: 0.8rem; color: var(--text-muted);">Branch</label>
      <input type="text" id="ghBranch" value="main">
      <label style="font-size: 0.8rem; color: var(--text-muted);">Personal Access Token (PAT)</label>
      <input type="password" id="ghToken" placeholder="ghp_...">
      <div class="modal-actions">
        <button class="btn btn-secondary" onclick="document.getElementById('adminPanelModal').style.display='none'">Cancel</button>
        <button class="btn" onclick="saveAdminSettings()">Save & Connect</button>
      </div>
    </div>
  </div>

  <script>
    // --------------------------------------------------------------------
    // 1. HARDCODED PUBLIC REPO SETTINGS (Anyone visiting loads from here)
    // --------------------------------------------------------------------
    const DEFAULT_OWNER = "sethukrishnan7561"; 
    const DEFAULT_REPO = "WEDDING-SITE";   
    const DEFAULT_BRANCH = "main";
    const SECRET_ADMIN_PASS = "admin2026";

    // Banner Slideshow Script[cite: 1]
    const slides = document.querySelectorAll('.banner-slide');
    let curSlide = 0;
    setInterval(() => {
      slides[curSlide].classList.remove('active');
      curSlide = (curSlide + 1) % slides.length;
      slides[curSlide].classList.add('active');
    }, 4500);

    // --------------------------------------------------------------------
    // MANUAL VIDEO LINKING ARRAY (Add your direct video paths or URLs here)
    // --------------------------------------------------------------------
    const manualVideos = [
      ["video1.mp4", "video2.mp4", "video3.mp4", "video4.mp4"], // Column 1 sliding videos
      ["video2.mp4", "video3.mp4", "video4.mp4", "video1.mp4"], // Column 2 sliding videos
      ["video3.mp4", "video4.mp4", "video1.mp4", "video2.mp4"], // Column 3 sliding videos
      ["video4.mp4", "video1.mp4", "video2.mp4", "video3.mp4"]  // Column 4 sliding videos
    ];

    function loadManualReels() {
      const gridSection = document.getElementById("reelGridSection");
      gridSection.innerHTML = "";

      manualVideos.forEach((videoList, i) => {
        const card = document.createElement("div");
        card.className = "reel-card";
        
        card.innerHTML = `
          <div class="reel-container" id="container_${i}">
            <div class="reel-slider-track" id="track_${i}">
              ${videoList.map(src => `<video class="reel-slide" src="${src}" muted playsinline></video>`).join('')}
            </div>
            <div class="custom-player-controls">
              <div class="video-progress-bar" onclick="seekVideo(event, 'active_vid_${i}')">
                <div class="video-progress-filled" id="progress_${i}"></div>
              </div>
              <div class="controls-row">
                <div class="controls-left">
                  <button class="control-btn" id="playbtn_${i}" onclick="togglePlay('${i}')">▶</button>
                  <span id="time_${i}" style="font-size: 0.7rem;">0:00</span>
                </div>
                <div class="controls-right">
                  <button class="control-btn" onclick="toggleMute('${i}')">🔊</button>
                </div>
              </div>
            </div>
          </div>
        `;
        gridSection.appendChild(card);

        setupReelWithControls(i, videoList.length);
      });
    }

    function setupReelWithControls(cardIdx, totalSlides) {
      const track = document.getElementById(`track_${cardIdx}`);
      let currentIdx = 0;

      function updateActiveVideo() {
        Array.from(track.children).forEach((vid) => {
          vid.pause();
          vid.id = "";
          vid.currentTime = 0;
        });

        const activeVid = track.children[currentIdx];
        activeVid.id = `active_vid_${cardIdx}`;
        activeVid.play().catch(() => {});
        document.getElementById(`playbtn_${cardIdx}`).textContent = "❚❚";

        activeVid.ontimeupdate = () => {
          if (activeVid.duration) {
            const percent = (activeVid.currentTime / activeVid.duration) * 100;
            document.getElementById(`progress_${cardIdx}`).style.width = percent + "%";
            
            let mins = Math.floor(activeVid.currentTime / 60);
            let secs = Math.floor(activeVid.currentTime % 60);
            document.getElementById(`time_${cardIdx}`).textContent = `${mins}:${secs < 10 ? '0' : ''}${secs}`;
          }
        };

        activeVid.onended = () => {
          currentIdx = (currentIdx + 1) % totalSlides;
          track.style.transform = `translateX(-${currentIdx * 100}%)`;
          updateActiveVideo();
        };
      }

      updateActiveVideo();

      setInterval(() => {
        currentIdx = (currentIdx + 1) % totalSlides;
        track.style.transform = `translateX(-${currentIdx * 100}%)`;
        updateActiveVideo();
      }, 7000);
    }

    function togglePlay(cardIdx) {
      const vid = document.getElementById(`active_vid_${cardIdx}`);
      const btn = document.getElementById(`playbtn_${cardIdx}`);
      if (vid) {
        if (vid.paused) {
          vid.play();
          btn.textContent = "❚❚";
        } else {
          vid.pause();
          btn.textContent = "▶";
        }
      }
    }

    function toggleMute(cardIdx) {
      const vid = document.getElementById(`active_vid_${cardIdx}`);
      if (vid) {
        vid.muted = !vid.muted;
      }
    }

    function seekVideo(event, vidId) {
      const vid = document.getElementById(vidId);
      if (vid && vid.duration) {
        const rect = event.currentTarget.getBoundingClientRect();
        const pos = (event.clientX - rect.left) / rect.width;
        vid.currentTime = pos * vid.duration;
      }
    }

    const folders = [
      { id: "save-the-date", title: "Save the date", defaultCover: "https://images.unsplash.com/photo-1519741497674-611481863552?auto=format&fit=crop&w=800&q=80" },
      { id: "engagement", title: "Engagement", defaultCover: "https://images.unsplash.com/photo-1511285560929-80b456fea0bc?auto=format&fit=crop&w=800&q=80" },
      { id: "wedding", title: "Wedding", defaultCover: "https://images.unsplash.com/photo-1465495976277-4387d4b0b4c6?auto=format&fit=crop&w=800&q=80" },
      { id: "highlights", title: "Highlights", defaultCover: "https://images.unsplash.com/photo-1537633552985-df8429e8048b?auto=format&fit=crop&w=800&q=80" }
    ];

    let currentFolderId = "";
    let isAdmin = false;

    // --------------------------------------------------------------------
    // 2. SECRET ACCESS GATE
    // --------------------------------------------------------------------
    function checkAdminAccess() {
      const params = new URLSearchParams(window.location.search);
      if (params.get("key") === SECRET_ADMIN_PASS) {
        localStorage.setItem("admin_authorized", "true");
        window.history.replaceState({}, document.title, window.location.pathname);
      }

      if (localStorage.getItem("admin_authorized") === "true") {
        isAdmin = true;
        document.getElementById("btnAdmin").style.display = "inline-flex";
        document.getElementById("btnUploadAdmin").style.display = "inline-block";
      }
    }

    function openAdminPanel() {
      document.getElementById("adminPanelModal").style.display = "flex";
      document.getElementById("ghOwner").value = localStorage.getItem("gh_owner") || DEFAULT_OWNER;
      document.getElementById("ghRepo").value = localStorage.getItem("gh_repo") || DEFAULT_REPO;
      document.getElementById("ghBranch").value = localStorage.getItem("gh_branch") || DEFAULT_BRANCH;
      document.getElementById("ghToken").value = localStorage.getItem("gh_token") || "";
    }

    async function saveAdminSettings() {
      const owner = document.getElementById("ghOwner").value.trim();
      const repo = document.getElementById("ghRepo").value.trim();
      const branch = document.getElementById("ghBranch").value.trim();
      const token = document.getElementById("ghToken").value.trim();

      localStorage.setItem("gh_owner", owner);
      localStorage.setItem("gh_repo", repo);
      localStorage.setItem("gh_branch", branch);
      localStorage.setItem("gh_token", token);

      document.getElementById("adminPanelModal").style.display = "none";
      await checkHealth();
      renderFolders();
    }

    async function checkHealth() {
      const owner = localStorage.getItem("gh_owner") || DEFAULT_OWNER;
      const repo = localStorage.getItem("gh_repo") || DEFAULT_REPO;
      const token = localStorage.getItem("gh_token");

      const dot = document.getElementById("syncDot");
      try {
        const headers = { "Accept": "application/vnd.github+json" };
        if (token) headers["Authorization"] = `token ${token}`;
        const res = await fetch(`https://api.github.com/repos/${owner}/${repo}`, { headers });
        if (res.ok) {
          dot.classList.add("connected");
        } else {
          dot.classList.remove("connected");
        }
      } catch (e) {
        dot.classList.remove("connected");
      }
    }

    // --------------------------------------------------------------------
    // 3. FETCH PHOTOS DIRECTLY FROM GITHUB REPO (PUBLIC FOR ALL VISITORS)
    // --------------------------------------------------------------------
    async function fetchGitHubFolder(folderId) {
      const owner = localStorage.getItem("gh_owner") || DEFAULT_OWNER;
      const repo = localStorage.getItem("gh_repo") || DEFAULT_REPO;
      const branch = localStorage.getItem("gh_branch") || DEFAULT_BRANCH;
      const token = localStorage.getItem("gh_token");

      const url = `https://api.github.com/repos/${owner}/${repo}/contents/uploads/${folderId}?ref=${branch}`;
      const headers = { "Accept": "application/vnd.github+json" };
      if (token) headers["Authorization"] = `token ${token}`;

      try {
        const res = await fetch(url, { headers });
        if (!res.ok) return [];
        const files = await res.json();
        return files.filter(f => /\.(jpe?g|png|gif|webp)$/i.test(f.name));
      } catch (err) {
        console.error("Failed fetching GitHub folder:", err);
        return [];
      }
    }

    async function renderFolders() {
      const grid = document.getElementById("folder-grid");
      grid.innerHTML = "";

      for (const f of folders) {
        const files = await fetchGitHubFolder(f.id);
        const coverSrc = files.length > 0 ? files[files.length - 1].download_url : f.defaultCover;

        const card = document.createElement("div");
        card.className = "album-card";
        card.innerHTML = `
          <div class="cover-container">
            <img src="${coverSrc}" class="folder-cover-preview" alt="${f.title}">
          </div>
          <div class="card-content">
            <div class="album-details"><h3>${f.title}</h3></div>
            <button class="btn" onclick="openFolder('${f.id}', '${f.title}')">View photos</button>
          </div>
        `;
        grid.appendChild(card);
      }
    }

    async function openFolder(id, title) {
      currentFolderId = id;
      document.getElementById("current-folder-title").textContent = title;
      document.getElementById("home-view").style.display = "none";
      document.getElementById("gallery-view").style.display = "block";
      await renderPhotos();
    }

    function goHome() {
      document.getElementById("gallery-view").style.display = "none";
      document.getElementById("home-view").style.display = "block";
      renderFolders();
    }

    async function renderPhotos() {
      const grid = document.getElementById("photo-grid");
      grid.innerHTML = "<p style='color: var(--text-muted);'>Loading memories...</p>";

      const files = await fetchGitHubFolder(currentFolderId);
      grid.innerHTML = "";

      if (files.length === 0) {
        grid.innerHTML = "<p style='color: var(--text-muted); padding: 1.5rem 0;'>No photos found in this collection.</p>";
        return;
      }

      files.forEach(file => {
        const card = document.createElement("div");
        card.className = "photo-card";
        card.innerHTML = `
          <img src="${file.download_url}" alt="${file.name}" onclick="window.open('${file.download_url}', '_blank')">
          <div class="photo-footer">
            <span class="photo-title">${file.name}</span>
            <button class="btn-delete-admin" style="${isAdmin ? 'display:inline-block;' : 'display:none;'}" onclick="deletePhotoFromGitHub('${file.path}', '${file.sha}')">🗑</button>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    // --------------------------------------------------------------------
    // 4. ADMIN WRITES (UPLOAD & DELETE TO GITHUB VIA REST API)
    // --------------------------------------------------------------------
    function openAddModal() {
      document.getElementById("imgTitleInput").value = "";
      document.getElementById("fileInput").value = "";
      document.getElementById("addModal").style.display = "flex";
    }

    function fileToBase64(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result.split(",")[1]);
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    async function uploadPhotoToGitHub() {
      const token = localStorage.getItem("gh_token");
      const owner = localStorage.getItem("gh_owner") || DEFAULT_OWNER;
      const repo = localStorage.getItem("gh_repo") || DEFAULT_REPO;
      const branch = localStorage.getItem("gh_branch") || DEFAULT_BRANCH;

      if (!token) {
        alert("Please click Admin Panel and enter your GitHub PAT token first!");
        return;
      }

      const fileInput = document.getElementById("fileInput");
      if (!fileInput.files[0]) {
        alert("Please pick an image.");
        return;
      }

      const file = fileInput.files[0];
      const btn = document.getElementById("btnSubmitUpload");
      btn.innerText = "Uploading...";
      btn.disabled = true;

      try {
        const base64 = await fileToBase64(file);
        const filename = `${Date.now()}_${file.name.replace(/\s+/g, "_")}`;
        const path = `uploads/${currentFolderId}/${filename}`;
        const url = `https://api.github.com/repos/${owner}/${repo}/contents/${path}`;

        const res = await fetch(url, {
          method: "PUT",
          headers: {
            "Accept": "application/vnd.github+json",
            "Authorization": `token ${token.trim()}`,
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            message: `Add ${filename} via Admin Panel`,
            content: base64,
            branch: branch
          })
        });

        if (res.ok) {
          document.getElementById("addModal").style.display = "none";
          alert("Uploaded successfully to GitHub! All devices can now see this photo.");
          await renderPhotos();
        } else {
          const err = await res.json();
          alert("GitHub error: " + err.message);
        }
      } catch (err) {
        alert("Upload error: " + err.message);
      } finally {
        btn.innerText = "Upload & Push";
        btn.disabled = false;
      }
    }

    async function deletePhotoFromGitHub(path, sha) {
      const token = localStorage.getItem("gh_token");
      const owner = localStorage.getItem("gh_owner") || DEFAULT_OWNER;
      const repo = localStorage.getItem("gh_repo") || DEFAULT_REPO;
      const branch = localStorage.getItem("gh_branch") || DEFAULT_BRANCH;

      if (!token) {
        alert("Unauthorized. Set your token in Admin Panel.");
        return;
      }

      if (!confirm("Are you sure you want to permanently delete this photo from GitHub?")) return;

      try {
        const url = `https://api.github.com/repos/${owner}/${repo}/contents/${path}`;
        const res = await fetch(url, {
          method: "DELETE",
          headers: {
            "Accept": "application/vnd.github+json",
            "Authorization": `token ${token.trim()}`,
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            message: `Delete ${path} via Admin Panel`,
            sha: sha,
            branch: branch
          })
        });

        if (res.ok) {
          alert("Photo deleted from repository.");
          await renderPhotos();
        } else {
          const err = await res.json();
          alert("Delete failed: " + err.message);
        }
      } catch (err) {
        alert("Error: " + err.message);
      }
    }

    window.addEventListener("DOMContentLoaded", async () => {
      checkAdminAccess();
      await checkHealth();
      await renderFolders();
      loadManualReels();
    });
  </script>
</body>
