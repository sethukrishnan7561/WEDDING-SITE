<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LENI & JACKSON - Selection Album</title>
    <style>
        :root {
            --card-bg: rgba(255, 255, 255, 0.92);
            --text-main: #2d3748;
            --text-muted: #718096;
            --accent-color: #3182ce;
            --accent-hover: #2b6cb0;
            --border-color: #e2e8f0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            /* Christian wedding background image with a dark overlay for readability */
            background: linear-gradient(rgba(0, 0, 0, 0.4), rgba(0, 0, 0, 0.4)), 
                        url('https://images.unsplash.com/photo-1519741497674-611481863552?auto=format&fit=crop&w=1920&q=80') no-repeat center center fixed;
            background-size: cover;
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 40px;
            background: rgba(255, 255, 255, 0.95);
            border-bottom: 1px solid var(--border-color);
            backdrop-filter: blur(5px);
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo-placeholder {
            font-weight: bold;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-muted);
            border: 1px dashed var(--border-color);
            padding: 8px 12px;
            border-radius: 4px;
        }

        .album-title {
            font-size: 20px;
            font-weight: 500;
            color: var(--text-main);
            letter-spacing: 0.5px;
        }

        main {
            flex: 1;
            max-width: 800px;
            width: 100%;
            margin: 40px auto;
            padding: 0 20px;
        }

        .albums-container {
            display: flex;
            flex-direction: column;
            gap: 16px;
            margin-bottom: 40px;
        }

        .album-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            backdrop-filter: blur(5px);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .album-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.15);
        }

        .album-info {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .folder-title {
            font-size: 18px;
            font-weight: 600;
            color: var(--text-main);
        }

        .photo-count {
            font-size: 14px;
            color: var(--text-muted);
        }

        .btn {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            text-decoration: none;
            transition: background-color 0.2s ease;
        }

        .btn:hover {
            background-color: var(--accent-hover);
        }

        .selection-banner {
            text-align: center;
            margin: 30px 0;
            font-size: 16px;
            color: white;
            text-shadow: 0 1px 3px rgba(0, 0, 0, 0.6);
        }

        .selection-banner a {
            color: #90cdf4;
            text-decoration: none;
            font-weight: 500;
        }

        .selection-banner a:hover {
            text-decoration: underline;
        }

        section {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 24px;
            text-align: center;
            margin-bottom: 40px;
            backdrop-filter: blur(5px);
        }

        section h2 {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 16px;
            color: var(--text-main);
        }

        .contact-details {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        .contact-details a {
            color: var(--accent-color);
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
        }

        .contact-details a:hover {
            text-decoration: underline;
        }

        footer {
            text-align: center;
            padding: 20px;
            font-size: 13px;
            color: #ffffff;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.6);
            border-top: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(5px);
        }

        footer a {
            color: #90cdf4;
            text-decoration: none;
        }

        footer a:hover {
            text-decoration: underline;
        }

        @media (max-width: 600px) {
            header {
                padding: 15px 20px;
                flex-direction: column;
                gap: 15px;
            }
            .album-card {
                flex-direction: column;
                align-items: flex-start;
                gap: 16px;
            }
            .btn {
                width: 100%;
                text-align: center;
            }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo-area">
            <div class="logo-placeholder">Memories Forever Begins</div>
        </div>
        <div class="album-title">Leni & Jackson</div>
    </header>

    <main>
        <div class="albums-container">
            <div class="album-card">
                <div class="album-info">
                    <span class="folder-title">Save The Date</span>
                
                </div>
                <a href="#" class="btn">View photos</a>
            </div>

            <div class="album-card">
                <div class="album-info">
                    <span class="folder-title">Engagement</span>
                </div>
                <a href="#" class="btn">View photos</a>
            </div>

            <div class="album-card">
                <div class="album-info">
                    <span class="folder-title">Wedding</span>
                </div>
                <a href="#" class="btn">View photos</a>
            </div>

            <div class="album-card">
                <div class="album-info">
                    <span class="folder-title">Highlights</span>
                </div>
                <a href="#" class="btn">View photos</a>
            </div>
           
        </div>
    
        </section>
    </main>

    <footer>
        © 2026 Leni&Jackson 
    </footer>

</body>
</html>
