<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title> Memories</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #c5a059;
      --primary-hover: #b08d48;
      --bg-dark: rgba(18, 18, 18, 0.85);
      --card-bg: rgba(255, 255, 255, 0.08);
      --card-border: rgba(255, 255, 255, 0.15);
      --text-main: #f8f9fa;
      --text-muted: #dcdcdc;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Montserrat', sans-serif;
      color: var(--text-main);
      min-height: 100vh;
      background: linear-gradient(rgba(10, 10, 15, 0.7), rgba(10, 10, 15, 0.85)),
                  url('https://images.unsplash.com/photo-1519741497674-611481863552?auto=format&fit=crop&w=1920&q=80') center/cover no-repeat fixed;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Header & Special Memories Banner */
    header {
      width: 100%;
      text-align: center;
      padding: 50px 20px 20px;
    }

    h1 {
      font-family: 'Cormorant Garamond', serif;
      font-size: 3.5rem;
      font-weight: 600;
      letter-spacing: 2px;
      color: #fff;
      text-shadow: 0 4px 15px rgba(0,0,0,0.6);
    }

    .subtitle {
      font-size: 1.1rem;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: var(--primary);
      margin-top: 5px;
    }

    .special-banner {
      width: 90%;
      max-width: 1100px;
      margin: 30px auto;
      padding: 24px;
      background: linear-gradient(135deg, rgba(197, 160, 89, 0.25), rgba(255, 255, 255, 0.05));
      border: 1px solid var(--primary);
      border-radius: 12px;
      backdrop-filter: blur(10px);
      text-align: center;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
    }

    .special-banner h2 {
      font-family: 'Cormorant Garamond', serif;
      font-size: 2rem;
      color: #fff;
      margin-bottom: 8px;
    }

    .special-banner p {
      color: var(--text-muted);
      font-size: 0.95rem;
      line-height: 1.5;
    }

    /* Container & Upload Section */
    .container {
      width: 90%;
      max-width: 1200px;
      margin-bottom: 60px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .upload-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 15px;
      justify-content: center;
      align-items: center;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      padding: 18px 24px;
      border-radius: 50px;
      backdrop-filter: blur(8px);
      margin-bottom: 30px;
    }

    .file-input-wrapper {
      position: relative;
      overflow: hidden;
      display: inline-block;
    }

    .file-input-wrapper input[type=file] {
      position: absolute;
      left: 0;
      top: 0;
      opacity: 0;
      width: 100%;
      height: 100%;
      cursor: pointer;
    }

    .btn {
      background: var(--primary);
      color: #111;
      padding: 10px 22px;
      border: none;
      border-radius: 25px;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: background 0.2s ease, transform 0.1s ease;
    }

    .btn:hover {
      background: var(--primary-hover);
      transform: translateY(-1px);
    }

    .category-select {
      background: rgba(0, 0, 0, 0.4);
      color: #fff;
      border: 1px solid var(--card-border);
      padding: 10px 16px;
      border-radius: 20px;
      font-family: inherit;
      outline: none;
    }

    /* Tabs */
    .tabs-nav {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 25px;
      justify-content: center;
    }

    .tab-button {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--card-border);
      color: var(--text-muted);
      padding: 10px 20px;
      border-radius: 20px;
      cursor: pointer;
      transition: all 0.2s ease;
      font-weight: 500;
    }

    .tab-button.active, .tab-button:hover {
      background: var(--primary);
      color: #111;
      border-color: var(--primary);
      font-weight: 600;
    }

    /* Gallery Grid */
    .gallery-grid {
      width: 100%;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 20px;
    }

    .memory-card {
      position: relative;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      overflow: hidden;
      backdrop-filter: blur(5px);
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
      aspect-ratio: 4 / 3;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .memory-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 10px 25px rgba(0,0,0,0.6);
    }

    .memory-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .card-actions {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 10px;
      background: linear-gradient(transparent, rgba(0,0,0,0.8));
      display: flex;
      justify-content: flex-end;
      opacity: 0;
      transition: opacity 0.2s ease;
    }

    .memory-card:hover .card-actions {
      opacity: 1;
    }

    .action-btn {
      background: rgba(255, 255, 255, 0.2);
      border: none;
      color: #fff;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 0.8rem;
      cursor: pointer;
      backdrop-filter: blur(4px);
      text-decoration: none;
    }

    .action-btn:hover {
      background: var(--primary);
      color: #111;
    }

    .empty-state {
      grid-column: 1 / -1;
      text-align: center;
      padding: 40px;
      color: var(--text-muted);
      font-style: italic;
    }

    /* Lightbox Modal */
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.9);
      backdrop-filter: blur(8px);
      z-index: 999;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      padding: 20px;
    }

    .modal.open {
      display: flex;
    }

    .modal-content {
      max-width: 90vw;
      max-height: 80vh;
      border-radius: 8px;
      box-shadow: 0 5px 30px rgba(0,0,0,0.8);
      object-fit: contain;
    }

    .modal-controls {
      margin-top: 15px;
      display: flex;
      gap: 15px;
    }

    .close-btn {
      position: absolute;
      top: 20px;
      right: 25px;
      font-size: 2.2rem;
      color: #fff;
      cursor: pointer;
      background: none;
      border: none;
    }
  </style>
</head>
<body>

  <header>
    <h1>Leni & Jackson</h1>
    <div class="subtitle">Memories Forever Begins</div>
  </header>

  <div class="container">
    <!-- Upload Section -->
    <div class="upload-bar">
      <div class="file-input-wrapper">
        <button class="btn">Choose Photos</button>
        <input type="file" id="imageInput" accept="image/*" multiple />
      </div>

      <select id="uploadCategory" class="category-select">
        <option value="pre-wedding">Save The Date</option>
        <option value="ceremony">Engagement</option>
        <option value="reception">Wedding</option>
      </select>

      <button id="uploadBtn" class="btn" style="background:#fff; color:#111;">Add to Album</button>
    </div>

    <!-- Category Tabs -->
    <div class="tabs-nav">
      <button class="tab-button active" data-category="all">All Photos</button>
      <button class="tab-button" data-category="pre-wedding">Save The Date</button>
      <button class="tab-button" data-category="ceremony">Engagement</button>
      <button class="tab-button" data-category="reception">Wedding</button>>
    </div>

    <!-- Image Display Grid -->
    <div class="gallery-grid" id="galleryGrid"></div>
  </div>

  <!-- Lightbox Viewer Modal -->
  <div class="modal" id="viewerModal">
    <button class="close-btn" id="closeModal">&times;</button>
    <img class="modal-content" id="modalImg" src="" alt="Enlarged Wedding Memory" />
    <div class="modal-controls">
      <a id="modalDownload" class="btn" download="wedding-memory.jpg">Download Image</a>
    </div>
  </div>

  <script>
    // --- IndexedDB Configuration for Persistent Local Storage ---
    const DB_NAME = 'WeddingMemoriesDB';
    const STORE_NAME = 'photos';
    let db;

    function initDB() {
      return new Promise((resolve, reject) => {
        const req = indexedDB.open(DB_NAME, 1);
        req.onupgradeneeded = (e) => {
          const dbInstance = e.target.result;
          if (!dbInstance.objectStoreNames.contains(STORE_NAME)) {
            dbInstance.createObjectStore(STORE_NAME, { keyPath: 'id', autoIncrement: true });
          }
        };
        req.onsuccess = (e) => {
          db = e.target.result;
          resolve();
        };
        req.onerror = (e) => reject(e);
      });
    }

    function savePhoto(fileBlob, category, name) {
      return new Promise((resolve, reject) => {
        const tx = db.transaction([STORE_NAME], 'readwrite');
        const store = tx.objectStore(STORE_NAME);
        const item = { blob: fileBlob, category, name, timestamp: Date.now() };
        const req = store.add(item);
        req.onsuccess = () => resolve();
        req.onerror = (e) => reject(e);
      });
    }

    function getPhotos(category = 'all') {
      return new Promise((resolve, reject) => {
        const tx = db.transaction([STORE_NAME], 'readonly');
        const store = tx.objectStore(STORE_NAME);
        const req = store.getAll();
        req.onsuccess = () => {
          let list = req.result;
          if (category !== 'all') {
            list = list.filter(item => item.category === category);
          }
          resolve(list.reverse()); // Latest first
        };
        req.onerror = (e) => reject(e);
      });
    }

    // --- UI Logic ---
    let currentCategory = 'all';

    async function renderGallery() {
      const grid = document.getElementById('galleryGrid');
      grid.innerHTML = '';

      const photos = await getPhotos(currentCategory);

      if (photos.length === 0) {
        grid.innerHTML = `<div class="empty-state">No photos added to this category yet. Upload some above!</div>`;
        return;
      }

      photos.forEach(photo => {
        const url = URL.createObjectURL(photo.blob);

        const card = document.createElement('div');
        card.className = 'memory-card';
        card.innerHTML = `
          <img src="${url}" alt="${photo.name}" />
          <div class="card-actions">
            <a href="${url}" download="${photo.name || 'wedding-photo.jpg'}" class="action-btn" onclick="event.stopPropagation()">Download</a>
          </div>
        `;

        card.addEventListener('click', () => openModal(url, photo.name));
        grid.appendChild(card);
      });
    }

    // Modal / Lightbox
    const modal = document.getElementById('viewerModal');
    const modalImg = document.getElementById('modalImg');
    const modalDownload = document.getElementById('modalDownload');

    function openModal(url, name) {
      modalImg.src = url;
      modalDownload.href = url;
      modalDownload.download = name || 'wedding-photo.jpg';
      modal.classList.add('open');
    }

    document.getElementById('closeModal').addEventListener('click', () => {
      modal.classList.remove('open');
    });

    modal.addEventListener('click', (e) => {
      if (e.target === modal) modal.classList.remove('open');
    });

    // Upload Execution
    document.getElementById('uploadBtn').addEventListener('click', async () => {
      const fileInput = document.getElementById('imageInput');
      const category = document.getElementById('uploadCategory').value;
      const files = fileInput.files;

      if (!files.length) {
        alert('Please choose at least one image file first.');
        return;
      }

      for (const file of files) {
        await savePhoto(file, category, file.name);
      }

      fileInput.value = '';
      renderGallery();
    });

    // Category Tabs Switching
    document.querySelectorAll('.tab-button').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.tab-button').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentCategory = btn.dataset.category;
        renderGallery();
      });
    });

    // Initialize Database and App
    initDB().then(() => {
      renderGallery();
    });
  </script>
</body>
</html>
