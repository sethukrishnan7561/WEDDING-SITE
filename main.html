<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Memories For Ever - Leni & Jackson</title>
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #dfc194;
      --primary-hover: #edd3a9;
      --bg-dark: #0f1115;
      --card-bg: #161920;
      --text: #f3f4f6;
      --text-muted: #9ca3af;
      --border: #2a2f3d;
      --danger: #ef4444;
      --success: #10b981;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    
    /* Added Smooth Scrolling */
    html {
      scroll-behavior: smooth;
    }

    body {
      background-color: var(--bg-dark);
      background-image: linear-gradient(rgba(15, 17, 21, 0.88), rgba(15, 17, 21, 0.92)), 
                        url('https://images.unsplash.com/photo-1519741497674-611481863552?auto=format&fit=crop&w=1920&q=80');
      background-size: cover; background-position: center; background-attachment: scroll;
      color: var(--text); line-height: 1.6; min-height: 100vh; display: flex; flex-direction: column;
    }

    /* Header */
    header {
      background: rgba(22, 25, 32, 0.85); backdrop-filter: blur(10px);
      padding: 1rem 2rem; display: grid; grid-template-columns: 1fr auto 1fr;
      align-items: center; border-bottom: 1px solid var(--border);
      position: relative; z-index: 50;
    }

    .header-left { justify-self: start; }
    .album-title { font-family: 'Great Vibes', cursive; font-size: 2rem; color: #ffffff; }
    .brand-center { font-family: 'Great Vibes', cursive; font-size: 2.2rem; color: var(--primary); text-align: center; }
    .header-right { justify-self: end; display: flex; align-items: center; gap: 1rem; }

    /* Admin Button: Hidden by default for public */
    .btn-admin {
      display: none;
      background: var(--primary); color: #0f1115; border: none;
      padding: 0.5rem 1.1rem; border-radius: 6px; font-size: 0.85rem;
      font-weight: 600; cursor: pointer; align-items: center; gap: 0.6rem;
    }
    .btn-admin:hover { background: var(--primary-hover); }

    /* Connection Status Indicator Light */
    .sync-indicator-dot {
      width: 10px; height: 10px; border-radius: 50%;
      background-color: var(--danger);
      box-shadow: 0 0 8px rgba(239, 68, 68, 0.9);
      display: inline-block;
    }
    .sync-indicator-dot.connected {
      background-color: var(--success);
      box-shadow: 0 0 8px rgba(16, 185, 129, 0.9);
    }

    .container { max-width: 1400px; margin: 2.5rem auto; padding: 0 1.5rem; flex-grow: 1; width: 100%; }

    /* Banner Slideshow */
    .banner-section {
      position: relative; width: 100%; height: 560px; border-radius: 12px;
      overflow: hidden; margin-bottom: 2.5rem; box-shadow: 0 12px 40px rgba(0, 0, 0, 0.6);
      border: 1px solid var(--border);
    }
    .banner-slide {
      position: absolute; inset: 0; background-size: cover; background-position: center;
      opacity: 0; transition: opacity 1.2s ease-in-out; filter: brightness(0.85);
    }
    .banner-slide.active { opacity: 1; }

    /* YouTube Video Section (Matches banner width configuration) */
    .video-section {
      width: 100%;
      height: 480px;
      margin: 0 auto 2.5rem auto;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.6);
      border: 1px solid var(--border);
      background: var(--card-bg);
    }
    .video-section iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
    @media (max-width: 768px) {
      .video-section {
        height: 300px;
      }
    }

    /* Grid Folders - Adjusted to span full width of banner */
    .album-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1.5rem; width: 100%; margin: 0 auto; }
    @media (max-width: 1024px) { .album-grid { grid-template-columns: repeat(2, 1fr); } }
    @media (max-width: 640px) { .album-grid { grid-template-columns: 1fr; } }

    .album-card {
      background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px;
      overflow: hidden; display: flex; flex-direction: column; justify-content: space-between;
      text-align: center;
    }
    .cover-container { width: 100%; height: 200px; background-color: #1f2430; }
    .folder-cover-preview { width: 100%; height: 100%; object-fit: cover; }
    .card-content { padding: 1.1rem 1rem; }
    .album-details h3 { font-size: 1.15rem; color: var(--text); font-family: "Georgia", serif; margin-bottom: 0.9rem; }

    .btn {
      background: var(--primary); color: #0f1115; padding: 0.55rem 0.75rem;
      border-radius: 6px; font-size: 0.85rem; font-weight: 600; cursor: pointer; border: none; width: 100%;
    }
    .btn:hover { background: var(--primary-hover); }

    /* Gallery View */
    .view-section { display: none; }
    .view-header {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 1.5rem; border-bottom: 1px solid var(--border); padding-bottom: 1rem;
    }
    .folder-heading { font-family: "Georgia", serif; font-size: 2rem; color: #ffffff; }

    .action-bar { display: flex; gap: 0.75rem; }
    .btn-secondary { background: transparent; color: var(--text); border: 1px solid var(--border); width: auto; padding: 0.5rem 1rem; }
    .btn-secondary:hover { background: rgba(255, 255, 255, 0.05); }
    .btn-upload-admin { display: none; width: auto; padding: 0.5rem 1rem; }

    /* Perfect Fit Vertical Grid Format */
    .photo-grid { 
      display: grid; 
      grid-template-columns: repeat(4, 1fr); 
      gap: 1.5rem; 
      padding-bottom: 1.5rem; 
    }
    @media (max-width: 1024px) { .photo-grid { grid-template-columns: repeat(2, 1fr); } }
    @media (max-width: 640px) { .photo-grid { grid-template-columns: 1fr; } }

    .photo-card {
      position: relative;
      background: var(--card-bg); 
      border: 1px solid var(--border); 
      border-radius: 10px;
      overflow: hidden; 
      width: 100%;
      aspect-ratio: 4 / 3;
    }
    .photo-card img { 
      width: 100%; 
      height: 100%; 
      object-fit: cover; 
      cursor: pointer; 
      display: block; 
      transition: transform 0.3s ease;
    }
    .photo-card img:hover {
      transform: scale(1.03);
    }
    .btn-delete-admin { 
      display: none; 
      position: absolute;
      top: 10px;
      right: 10px;
      background: rgba(239, 68, 68, 0.85); 
      color: white; 
      border: none; 
      padding: 0.4rem 0.6rem; 
      border-radius: 6px; 
      cursor: pointer; 
      z-index: 10;
      backdrop-filter: blur(4px);
      transition: background 0.2s;
    }
    .btn-delete-admin:hover {
      background: rgba(239, 68, 68, 1);
    }

    /* Modals */
    .modal {
      display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8);
      backdrop-filter: blur(5px); justify-content: center; align-items: center; z-index: 1000;
    }
    .modal-content {
      background: var(--card-bg); border: 1px solid var(--border);
      padding: 2rem; border-radius: 12px; width: 100%; max-width: 440px;
    }
    .modal-content input {
      width: 100%; padding: 0.7rem; margin-top: 0.25rem; margin-bottom: 1rem;
      background: #0f1115; border: 1px solid var(--border); color: white; border-radius: 6px;
    }
    .modal-actions { display: flex; justify-content: flex-end; gap: 0.75rem; }

    /* Lightbox Viewer Styles */
    #lightboxModal {
      background: rgba(0, 0, 0, 0.95);
      user-select: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }
    .lightbox-container {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }
    #lightboxImg {
      max-width: 85vw;
      max-height: 80vh;
      object-fit: contain;
      transition: transform 0.1s ease-out;
      cursor: grab;
      touch-action: none;
    }
    #lightboxImg:active {
      cursor: grabbing;
    }
    .lightbox-arrow {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(255, 255, 255, 0.15);
      color: white;
      border: none;
      font-size: 2rem;
      padding: 0.5rem 1rem;
      cursor: pointer;
      border-radius: 50%;
      z-index: 1020;
      transition: background 0.2s;
    }
    .lightbox-arrow:hover {
      background: rgba(255, 255, 255, 0.3);
    }
    #lightboxPrev { left: 20px; }
    #lightboxNext { right: 20px; }
    
    .lightbox-bottom-bar {
      position: absolute;
      bottom: 20px;
      display: flex;
      gap: 1rem;
      z-index: 1020;
    }
  </style>
</head>
<body>

  <header>
    <div class="header-left"><div class="album-title">Leni & Jackson</div></div>
    <div class="brand-center">Memories For Ever</div>
    <div class="header-right">
      <button class="btn-admin" id="btnAdmin">
        Admin Panel
        <span class="sync-indicator-dot" id="syncDot" title="GitHub Connection Status"></span>
      </button>
    </div>
  </header>

  <main class="container">
    <!-- Home / Folder Grid View -->
    <div id="home-view" class="view-section" style="display: block;">
      <div class="banner-section">
        <div class="banner-slide active" style="background-image: url('family1.jpg');"></div>
        <div class="banner-slide" style="background-image: url('cover.jpg');"></div>
        <div class="banner-slide" style="background-image: url('family2.jpg');"></div>
        <div class="banner-slide" style="background-image: url('family3.jpg');"></div>
      </div>
      
      <!-- YouTube Video Player Window -->
      <div class="video-section">
        <iframe src="https://www.youtube.com/embed/gBmXWUkYXc0" 
                title="YouTube video player" 
                frameborder="0" 
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
                allowfullscreen>
        </iframe>
      </div>

      <!-- Album Folders Grid -->
      <div class="album-grid" id="folder-grid"></div>
    </div>

    <!-- Gallery View -->
    <div id="gallery-view" class="view-section">
      <div class="view-header">
        <h2 class="folder-heading" id="current-folder-title">Folder</h2>
        <div class="action-bar">
          <button class="btn btn-secondary" onclick="goHome()">🏠 Home</button>
          <button class="btn btn-upload-admin" id="btnUploadAdmin">Upload Photo</button>
        </div>
      </div>
      <div id="photo-grid" class="photo-grid"></div>
    </div>
  </main>

  <!-- Upload Modal -->
  <div id="addModal" class="modal">
    <div class="modal-content">
      <h3 style="margin-bottom: 1rem;">Upload Photos to GitHub</h3>
      <input type="file" id="fileInput" accept="image/*" multiple>
      <div class="modal-actions">
        <button class="btn btn-secondary" id="closeUploadModal">Cancel</button>
        <button class="btn" id="btnSubmitUpload">Upload & Push</button>
      </div>
    </div>
  </div>

  <!-- Admin Settings Modal -->
  <div id="adminPanelModal" class="modal">
    <div class="modal-content">
      <h3 style="margin-bottom: 1rem;">GitHub Repository Sync</h3>
      <label style="font-size: 0.8rem; color: var(--text-muted);">Repository Username</label>
      <input type="text" id="ghOwner" placeholder="e.g. sethukrishnan7561">
      <label style="font-size: 0.8rem; color: var(--text-muted);">Repository Name</label>
      <input type="text" id="ghRepo" placeholder="e.g. WEDDING-SITE">
      <label style="font-size: 0.8rem; color: var(--text-muted);">Branch</label>
      <input type="text" id="ghBranch" value="main">
      <label style="font-size: 0.8rem; color: var(--text-muted);">Personal Access Token (PAT)</label>
      <input type="password" id="ghToken" placeholder="ghp_...">
      <div class="modal-actions">
        <button class="btn btn-secondary" id="closeAdminModal">Cancel</button>
        <button class="btn" id="saveAdminBtn">Save & Connect</button>
      </div>
    </div>
  </div>

  <!-- Lightbox Image Viewer Modal with Scroll/Pinch Zoom, Arrows & Swipe -->
  <div id="lightboxModal" class="modal">
    <span onclick="closeLightbox()" style="position: absolute; top: 20px; right: 30px; font-size: 2.5rem; color: white; cursor: pointer; z-index: 1030;">&times;</span>
    
    <button class="lightbox-arrow" id="lightboxPrev" onclick="prevImage()">&#10094;</button>
    <button class="lightbox-arrow" id="lightboxNext" onclick="nextImage()">&#10095;</button>

    <div class="lightbox-container" id="lightboxContainer">
      <img id="lightboxImg" src="" alt="Zoomable Image">
    </div>

    <div class="lightbox-bottom-bar">
      <a id="lightboxDownloadBtn" href="" download class="btn btn-secondary" title="Download Image" style="padding: 0.5rem 1rem; font-size: 1.1rem; text-decoration: none; display: inline-flex; align-items: center;">📥 Download</a>
    </div>
  </div>

  <script>
    const DEFAULT_OWNER = "sethukrishnan7561";
    const DEFAULT_REPO = "WEDDING-SITE";
    const DEFAULT_BRANCH = "main";
    const SECRET_ADMIN_PASS = "admin2026";

    // Banner Slideshow Script
    const slides = document.querySelectorAll('.banner-slide');
    let curSlide = 0;
    if (slides.length > 0) {
      setInterval(() => {
        slides[curSlide].classList.remove('active');
        curSlide = (curSlide + 1) % slides.length;
        slides[curSlide].classList.add('active');
      }, 4500);
    }

    const folders = [
      { id: "save-the-date", title: "Save the date", defaultCover: "https://images.unsplash.com/photo-1519741497674-611481863552?auto=format&fit=crop&w=800&q=80" },
      { id: "engagement", title: "Engagement", defaultCover: "https://images.unsplash.com/photo-1511285560929-80b456fea0bc?auto=format&fit=crop&w=800&q=80" },
      { id: "wedding", title: "Wedding", defaultCover: "https://images.unsplash.com/photo-1465495976277-4387d4b0b4c6?auto=format&fit=crop&w=800&q=80" }
    ];

    let currentFolderId = "";
    let isAdmin = false;
    let currentFiles = [];
    let currentIndex = 0;

    // Zoom & Pan state variables
    let currentScale = 1;
    let panX = 0;
    let panY = 0;
    let isDragging = false;
    let startX = 0;
    let startY = 0;
    let initialPinchDistance = null;

    function checkAdminAccess() {
      const urlParams = new URLSearchParams(window.location.search);
      if (urlParams.get("key") === SECRET_ADMIN_PASS) {
        localStorage.setItem("admin_authorized", "true");
        window.history.replaceState({}, document.title, window.location.pathname);
      }

      if (localStorage.getItem("admin_authorized") === "true") {
        isAdmin = true;
        const btnAdmin = document.getElementById("btnAdmin");
        const btnUploadAdmin = document.getElementById("btnUploadAdmin");
        if (btnAdmin) btnAdmin.style.display = "inline-flex";
        if (btnUploadAdmin) btnUploadAdmin.style.display = "inline-block";
      }
    }

    document.addEventListener("DOMContentLoaded", async () => {
      checkAdminAccess();

      const btnAdmin = document.getElementById("btnAdmin");
      const adminModal = document.getElementById("adminPanelModal");
      const closeAdminModal = document.getElementById("closeAdminModal");
      const saveAdminBtn = document.getElementById("saveAdminBtn");

      if (btnAdmin) {
        btnAdmin.addEventListener("click", () => {
          adminModal.style.display = "flex";
          document.getElementById("ghOwner").value = localStorage.getItem("gh_owner") || DEFAULT_OWNER;
          document.getElementById("ghRepo").value = localStorage.getItem("gh_repo") || DEFAULT_REPO;
          document.getElementById("ghBranch").value = localStorage.getItem("gh_branch") || DEFAULT_BRANCH;
          document.getElementById("ghToken").value = localStorage.getItem("gh_token") || "";
        });
      }

      if (closeAdminModal) {
        closeAdminModal.addEventListener("click", () => {
          adminModal.style.display = "none";
        });
      }

      if (saveAdminBtn) {
        saveAdminBtn.addEventListener("click", async () => {
          const owner = document.getElementById("ghOwner").value.trim();
          const repo = document.getElementById("ghRepo").value.trim();
          const branch = document.getElementById("ghBranch").value.trim();
          const token = document.getElementById("ghToken").value.trim();

          localStorage.setItem("gh_owner", owner);
          localStorage.setItem("gh_repo", repo);
          localStorage.setItem("gh_branch", branch);
          localStorage.setItem("gh_token", token);

          adminModal.style.display = "none";
          await checkHealth();
          renderFolders();
        });
      }

      const btnUploadAdmin = document.getElementById("btnUploadAdmin");
      const addModal = document.getElementById("addModal");
      const closeUploadModal = document.getElementById("closeUploadModal");
      const btnSubmitUpload = document.getElementById("btnSubmitUpload");

      if (btnUploadAdmin) {
        btnUploadAdmin.addEventListener("click", () => {
          document.getElementById("fileInput").value = "";
          addModal.style.display = "flex";
        });
      }

      if (closeUploadModal) {
        closeUploadModal.addEventListener("click", () => {
          addModal.style.display = "none";
        });
      }

      if (btnSubmitUpload) {
        btnSubmitUpload.addEventListener("click", uploadPhotoToGitHub);
      }

      setupLightboxGestures();

      await checkHealth();
      await renderFolders();
    });

    async function checkHealth() {
      const owner = localStorage.getItem("gh_owner") || DEFAULT_OWNER;
      const repo = localStorage.getItem("gh_repo") || DEFAULT_REPO;
      const token = localStorage.getItem("gh_token");

      const dot = document.getElementById("syncDot");
      if (!dot) return;

      try {
        const headers = { "Accept": "application/vnd.github+json" };
        if (token) headers["Authorization"] = `token ${token}`;
        const res = await fetch(`https://api.github.com/repos/${owner}/${repo}`, { headers });
        if (res.ok) {
          dot.classList.add("connected");
        } else {
          dot.classList.remove("connected");
        }
      } catch (e) {
        dot.classList.remove("connected");
      }
    }

    async function fetchGitHubFolder(folderId) {
      const owner = localStorage.getItem("gh_owner") || DEFAULT_OWNER;
      const repo = localStorage.getItem("gh_repo") || DEFAULT_REPO;
      const branch = localStorage.getItem("gh_branch") || DEFAULT_BRANCH;
      const token = localStorage.getItem("gh_token");

      const url = `https://api.github.com/repos/${owner}/${repo}/contents/uploads/${folderId}?ref=${branch}`;
      const headers = { "Accept": "application/vnd.github+json" };
      if (token) headers["Authorization"] = `token ${token}`;

      try {
        const res = await fetch(url, { headers });
        if (!res.ok) return [];
        const files = await res.json();
        return files.filter(f => /\.(jpe?g|png|gif|webp)$/i.test(f.name));
      } catch (err) {
        console.error("Failed fetching GitHub folder:", err);
        return [];
      }
    }

    async function renderFolders() {
      const grid = document.getElementById("folder-grid");
      if (!grid) return;
      grid.innerHTML = "";

      for (const f of folders) {
        const files = await fetchGitHubFolder(f.id);
        const coverSrc = files.length > 0 ? files[files.length - 1].download_url : f.defaultCover;

        const card = document.createElement("div");
        card.className = "album-card";
        card.innerHTML = `
          <div class="cover-container">
            <img src="${coverSrc}" class="folder-cover-preview" alt="${f.title}">
          </div>
          <div class="card-content">
            <div class="album-details"><h3>${f.title}</h3></div>
            <button class="btn" onclick="openFolder('${f.id}', '${f.title}')">View photos</button>
          </div>
        `;
        grid.appendChild(card);
      }
    }

    window.openFolder = async function(id, title) {
      currentFolderId = id;
      document.getElementById("current-folder-title").textContent = title;
      document.getElementById("home-view").style.display = "none";
      document.getElementById("gallery-view").style.display = "block";
      await renderPhotos();
    }

    window.goHome = function() {
      document.getElementById("gallery-view").style.display = "none";
      document.getElementById("home-view").style.display = "block";
      renderFolders();
    }

    async function renderPhotos() {
      const grid = document.getElementById("photo-grid");
      if (!grid) return;
      grid.innerHTML = "<p style='color: var(--text-muted);'>Loading memories...</p>";

      currentFiles = await fetchGitHubFolder(currentFolderId);
      grid.innerHTML = "";

      if (currentFiles.length === 0) {
        grid.innerHTML = "<p style='color: var(--text-muted); padding: 1.5rem 0;'>No photos found in this collection.</p>";
        return;
      }

      currentFiles.forEach((file, index) => {
        const card = document.createElement("div");
        card.className = "photo-card";
        card.innerHTML = `
          <img src="${file.download_url}" alt="${file.name}" onclick="openLightbox(${index})">
          <button class="btn-delete-admin" style="${isAdmin ? 'display:block;' : 'display:none;'}" onclick="deletePhotoFromGitHub('${file.path}', '${file.sha}')">🗑</button>
        `;
        grid.appendChild(card);
      });
    }

    // Lightbox & Navigation Logic
    window.openLightbox = function(index) {
      currentIndex = index;
      const modal = document.getElementById("lightboxModal");
      modal.style.display = "flex";
      loadCurrentImage();
    }

    window.closeLightbox = function() {
      document.getElementById("lightboxModal").style.display = "none";
    }

    function loadCurrentImage() {
      const file = currentFiles[currentIndex];
      const img = document.getElementById("lightboxImg");
      const downloadBtn = document.getElementById("lightboxDownloadBtn");

      currentScale = 1;
      panX = 0;
      panY = 0;
      updateImageTransform();

      img.src = file.download_url;
      downloadBtn.href = file.download_url;
      downloadBtn.setAttribute("download", file.name);
    }

    window.nextImage = function() {
      if (currentFiles.length === 0) return;
      currentIndex = (currentIndex + 1) % currentFiles.length;
      loadCurrentImage();
    }

    window.prevImage = function() {
      if (currentFiles.length === 0) return;
      currentIndex = (currentIndex - 1 + currentFiles.length) % currentFiles.length;
      loadCurrentImage();
    }

    function updateImageTransform() {
      const img = document.getElementById("lightboxImg");
      img.style.transform = `translate(${panX}px, ${panY}px) scale(${currentScale})`;
    }

    // Gestures Setup (Scroll zoom, pinch zoom, drag pan, and swipe navigation)
    function setupLightboxGestures() {
      const img = document.getElementById("lightboxImg");
      const container = document.getElementById("lightboxContainer");

      // Mouse Wheel Zoom
      container.addEventListener("wheel", (e) => {
        e.preventDefault();
        const zoomIntensity = 0.15;
        if (e.deltaY < 0) {
          currentScale = Math.min(currentScale + zoomIntensity, 4);
        } else {
          currentScale = Math.max(currentScale - zoomIntensity, 1);
          if (currentScale === 1) { panX = 0; panY = 0; }
        }
        updateImageTransform();
      }, { passive: false });

      // Mouse Drag / Touch Pan & Swipe Detection
      let touchStartX = 0;
      let touchEndX = 0;

      container.addEventListener("pointerdown", (e) => {
        if (e.target.tagName !== "IMG") return;
        isDragging = true;
        startX = e.clientX - panX;
        startY = e.clientY - panY;
        img.setPointerCapture(e.pointerId);
        touchStartX = e.clientX;
      });

      container.addEventListener("pointermove", (e) => {
        if (!isDragging) return;
        if (currentScale > 1) {
          panX = e.clientX - startX;
          panY = e.clientY - startY;
          updateImageTransform();
        }
      });

      container.addEventListener("pointerup", (e) => {
        if (!isDragging) return;
        isDragging = false;
        touchEndX = e.clientX;
        
        // If not zoomed, check for horizontal swipe to change image
        if (currentScale === 1) {
          const swipeThreshold = 50;
          if (touchStartX - touchEndX > swipeThreshold) {
            nextImage();
          } else if (touchEndX - touchStartX > swipeThreshold) {
            prevImage();
          }
        }
      });

      // Mobile Pinch-to-Zoom support
      container.addEventListener("touchstart", (e) => {
        if (e.touches.length === 2) {
          initialPinchDistance = Math.hypot(
            e.touches[0].clientX - e.touches[1].clientX,
            e.touches[0].clientY - e.touches[1].clientY
          );
        }
      }, { passive: true });

      container.addEventListener("touchmove", (e) => {
        if (e.touches.length === 2 && initialPinchDistance) {
          const currentDistance = Math.hypot(
            e.touches[0].clientX - e.touches[1].clientX,
            e.touches[0].clientY - e.touches[1].clientY
          );
          const factor = currentDistance / initialPinchDistance;
          currentScale = Math.min(Math.max(currentScale * factor, 1), 4);
          initialPinchDistance = currentDistance;
          if (currentScale === 1) { panX = 0; panY = 0; }
          updateImageTransform();
        }
      }, { passive: true });

      container.addEventListener("touchend", (e) => {
        if (e.touches.length < 2) {
          initialPinchDistance = null;
        }
      });
    }

    function fileToBase64(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result.split(",")[1]);
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    async function uploadPhotoToGitHub() {
      const token = localStorage.getItem("gh_token");
      const owner = localStorage.getItem("gh_owner") || DEFAULT_OWNER;
      const repo = localStorage.getItem("gh_repo") || DEFAULT_REPO;
      const branch = localStorage.getItem("gh_branch") || DEFAULT_BRANCH;

      if (!token) {
        alert("Please open Admin Panel and enter your GitHub PAT token first!");
        return;
      }

      const fileInput = document.getElementById("fileInput");
      const files = fileInput.files;
      
      if (files.length === 0) {
        alert("Please select at least one image file.");
        return;
      }

      const btn = document.getElementById("btnSubmitUpload");
      btn.disabled = true;

      let successCount = 0;

      for (let i = 0; i < files.length; i++) {
        const file = files[i];
        btn.innerText = `Uploading (${i + 1}/${files.length})...`;

        try {
          const base64 = await fileToBase64(file);
          const filename = `${Date.now()}_${file.name.replace(/\s+/g, "_")}`;
          const path = `uploads/${currentFolderId}/${filename}`;
          const url = `https://api.github.com/repos/${owner}/${repo}/contents/${path}`;

          const res = await fetch(url, {
            method: "PUT",
            headers: {
              "Accept": "application/vnd.github+json",
              "Authorization": `token ${token.trim()}`,
              "Content-Type": "application/json"
            },
            body: JSON.stringify({
              message: `Add ${filename} via Admin Panel`,
              content: base64,
              branch: branch
            })
          });

          if (res.ok) {
            successCount++;
          } else {
            const err = await res.json();
            console.error(`Failed to upload ${file.name}:`, err.message);
          }
        } catch (err) {
          console.error(`Error uploading ${file.name}:`, err.message);
        }
      }

      btn.innerText = "Upload & Push";
      btn.disabled = false;
      document.getElementById("addModal").style.display = "none";
      
      alert(`Successfully uploaded ${successCount} of ${files.length} photos to GitHub!`);
      await renderPhotos();
    }

    window.deletePhotoFromGitHub = async function(path, sha) {
      const token = localStorage.getItem("gh_token");
      const owner = localStorage.getItem("gh_owner") || DEFAULT_OWNER;
      const repo = localStorage.getItem("gh_repo") || DEFAULT_REPO;
      const branch = localStorage.getItem("gh_branch") || DEFAULT_BRANCH;

      if (!token) {
        alert("Unauthorized. Set your token in Admin Panel.");
        return;
      }

      if (!confirm("Are you sure you want to permanently delete this photo from GitHub?")) return;

      try {
        const url = `https://api.github.com/repos/${owner}/${repo}/contents/${path}`;
        const res = await fetch(url, {
          method: "DELETE",
          headers: {
            "Accept": "application/vnd.github+json",
            "Authorization": `token ${token.trim()}`,
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            message: `Delete ${path} via Admin Panel`,
            sha: sha,
            branch: branch
          })
        });

        if (res.ok) {
          alert("Photo deleted from repository.");
          await renderPhotos();
        } else {
          const err = await res.json();
          alert("Delete failed: " + err.message);
        }
      } catch (err) {
        alert("Error: " + err.message);
      }
    }
  </script>
