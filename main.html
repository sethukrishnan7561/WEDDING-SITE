<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memories - Leni & Jackson</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #1a1a1a;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background-image: linear-gradient(rgba(0, 0, 0, 0.7), rgba(0, 0, 0, 0.7)), url('https://images.unsplash.com/photo-1519741497674-611481863552?auto=format&fit=crop&q=80&w=1920');
            background-size: cover;
            background-position: center;
            padding: 20px;
        }

        .container {
            text-align: center;
            max-width: 800px;
            width: 100%;
        }

        h1 {
            font-size: 3.5rem;
            font-weight: 300;
            letter-spacing: 2px;
            margin-bottom: 10px;
            color: #f4ebd0;
        }

        .subtitle {
            font-size: 0.9rem;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: #d4af37;
            margin-bottom: 40px;
        }

        .upload-card {
            background: rgba(40, 40, 40, 0.6);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 40px;
            padding: 15px 25px;
            display: inline-flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 40px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .btn-choose {
            background-color: #d4af37;
            color: #1a1a1a;
            border: none;
            padding: 12px 24px;
            border-radius: 20px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s;
        }

        .btn-choose:hover {
            background-color: #e6c55c;
        }

        .select-wrapper {
            position: relative;
            background: rgba(20, 20, 20, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            padding: 12px 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
        }

        .select-wrapper select {
            background: transparent;
            border: none;
            color: #ffffff;
            font-size: 1rem;
            outline: none;
            cursor: pointer;
        }

        .select-wrapper select option {
            background-color: #282828;
            color: #ffffff;
        }

        .btn-add {
            background-color: #ffffff;
            color: #1a1a1a;
            border: none;
            padding: 12px 24px;
            border-radius: 20px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s;
        }

        .btn-add:hover {
            background-color: #e0e0e0;
        }

        .tabs {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 40px;
            flex-wrap: wrap;
        }

        .tab {
            background: rgba(40, 40, 40, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #ffffff;
            padding: 10px 24px;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .tab.active, .tab:hover {
            background-color: #d4af37;
            color: #1a1a1a;
            border-color: #d4af37;
            font-weight: 600;
        }

        .content-message {
            color: #b0b0b0;
            font-style: italic;
            font-size: 1.1rem;
        }

        /* Hidden real file input */
        #file-input {
            display: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Leni & Jackson</h1>
        <div class="subtitle">Memories Forever Begins</div>

        <div class="upload-card">
            <input type="file" id="file-input" multiple>
            <button class="btn-choose" onclick="document.getElementById('file-input').click();">Choose Photos</button>
            
            <div class="select-wrapper">
                <select id="category-select">
                    <option value="Save The Date">Save The Date</option>
                    <option value="Engagement">Engagement</option>
                    <option value="Wedding">Wedding</option>
                </select>
            </div>

            <button class="btn-add">Add to Album</button>
        </div>

        <div class="tabs">
            <button class="tab active">All Photos</button>
            <button class="tab">Save The Date</button>
            <button class="tab">Engagement</button>
            <button class="tab">Wedding</button>
        </div>

        <div class="content-message">
            No photos added to this category yet. Upload some above!
        </div>
    </div>

</body>
</html>
