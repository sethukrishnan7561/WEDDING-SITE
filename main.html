<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Memories For Ever - Leni & Jackson</title>
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #dfc194;
      --primary-hover: #edd3a9;
      --bg-dark: #0f1115;
      --card-bg: #161920;
      --text: #f3f4f6;
      --text-muted: #9ca3af;
      --border: #2a2f3d;
      --danger: #ef4444;
      --success: #10b981;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    
    html {
      scroll-behavior: smooth;
    }

    body {
      background-color: var(--bg-dark);
      background-image: linear-gradient(rgba(15, 17, 21, 0.88), rgba(15, 17, 21, 0.92)), 
                        url('https://images.unsplash.com/photo-1519741497674-611481863552?auto=format&fit=crop&w=1920&q=80');
      background-size: cover; background-position: center; background-attachment: scroll;
      color: var(--text); line-height: 1.6; min-height: 100vh; display: flex; flex-direction: column;
    }

    /* Header */
    header {
      background: rgba(22, 25, 32, 0.85); backdrop-filter: blur(10px);
      padding: 1rem 2rem; display: grid; grid-template-columns: 1fr auto 1fr;
      align-items: center; border-bottom: 1px solid var(--border);
      position: relative; z-index: 50;
    }

    .header-left { justify-self: start; }
    .album-title { font-family: 'Great Vibes', cursive; font-size: 2rem; color: #ffffff; }
    .brand-center { font-family: 'Great Vibes', cursive; font-size: 2.2rem; color: var(--primary); text-align: center; }
    .header-right { justify-self: end; display: flex; align-items: center; gap: 1rem; }

    .btn-admin {
      display: none;
      background: var(--primary); color: #0f1115; border: none;
      padding: 0.5rem 1.1rem; border-radius: 6px; font-size: 0.85rem;
      font-weight: 600; cursor: pointer; align-items: center; gap: 0.6rem;
    }
    .btn-admin:hover { background: var(--primary-hover); }

    .sync-indicator-dot {
      width: 10px; height: 10px; border-radius: 50%;
      background-color: var(--danger);
      box-shadow: 0 0 8px rgba(239, 68, 68, 0.9);
      display: inline-block;
    }
    .sync-indicator-dot.connected {
      background-color: var(--success);
      box-shadow: 0 0 8px rgba(16, 185, 129, 0.9);
    }

    .container { max-width: 1400px; margin: 2.5rem auto; padding: 0 1.5rem; flex-grow: 1; width: 100%; }

    /* Banner Slideshow */
    .banner-section {
      position: relative; width: 100%; height: 560px; border-radius: 12px;
      overflow: hidden; margin-bottom: 2.5rem; box-shadow: 0 12px 40px rgba(0, 0, 0, 0.6);
      border: 1px solid var(--border);
    }
    .banner-slide {
      position: absolute; inset: 0; background-size: cover; background-position: center;
      opacity: 0; transition: opacity 1.2s ease-in-out; filter: brightness(0.85);
    }
    .banner-slide.active { opacity: 1; }

    .video-section {
      width: 100%;
      height: 480px;
      margin: 0 auto 2.5rem auto;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.6);
      border: 1px solid var(--border);
      background: var(--card-bg);
    }
    .video-section iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
    @media (max-width: 768px) {
      .video-section { height: 300px; }
    }

    .album-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1.5rem; width: 100%; margin: 0 auto; }
    @media (max-width: 1024px) { .album-grid { grid-template-columns: repeat(2, 1fr); } }
    @media (max-width: 640px) { .album-grid { grid-template-columns: 1fr; } }

    .album-card {
      background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px;
      overflow: hidden; display: flex; flex-direction: column; justify-content: space-between;
      text-align: center; position: relative;
    }
    
    .cover-container { width: 100%; height: 260px; background-color: #1f2430; position: relative; cursor: pointer; }
    .folder-cover-preview { width: 100%; height: 100%; object-fit: cover; }
    
    .card-content { padding: 1.2rem 1rem; display: flex; flex-direction: column; gap: 0.75rem; }

    .btn-folder-title {
      background: var(--primary);
      color: #0f1115;
      border: none;
      width: 100%;
      padding: 0.6rem 1rem;
      border-radius: 8px;
      font-family: 'Great Vibes', cursive;
      font-size: 2rem;
      line-height: 1;
      cursor: pointer;
      transition: background 0.2s ease;
    }
    .btn-folder-title:hover {
      background: var(--primary-hover);
    }

    .btn-cover-admin {
      display: none; background: #3b82f6; color: white; padding: 0.45rem 0.75rem;
      border-radius: 6px; font-size: 0.8rem; font-weight: 600; cursor: pointer; border: none; width: 100%;
    }
    .btn-cover-admin:hover { background: #2563eb; }

    .view-section { display: none; }
    .view-header {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 1.5rem; border-bottom: 1px solid var(--border); padding-bottom: 1rem;
    }
    .folder-heading { font-family: "Georgia", serif; font-size: 2rem; color: #ffffff; }

    .action-bar { display: flex; gap: 0.75rem; align-items: center; }
    .btn-secondary { background: transparent; color: var(--text); border: 1px solid var(--border); width: auto; padding: 0.5rem 1rem; border-radius: 6px; cursor: pointer; }
    .btn-secondary:hover { background: rgba(255, 255, 255, 0.05); }
    .btn-upload-admin, .btn-reorder-admin { display: none; width: auto; padding: 0.5rem 1rem; border-radius: 6px; font-weight: 600; cursor: pointer; border: none; }
    .btn-reorder-admin { background: #3b82f6; color: white; }
    .btn-reorder-admin:hover { background: #2563eb; }
    .btn-upload-admin { background: var(--primary); color: #0f1115; }
    .btn-upload-admin:hover { background: var(--primary-hover); }

    .photo-grid { 
      display: grid; 
      grid-template-columns: repeat(4, 1fr); 
      gap: 1.5rem; 
      padding-bottom: 1.5rem; 
    }
    @media (max-width: 1024px) { .photo-grid { grid-template-columns: repeat(2, 1fr); } }
    @media (max-width: 640px) { .photo-grid { grid-template-columns: 1fr; } }

    .photo-card {
      position: relative;
      background: #000000; 
      border: 1px solid var(--border); 
      border-radius: 10px;
      overflow: hidden; 
      width: 100%;
      height: 280px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .photo-card img { 
      max-width: 100%; 
      max-height: 100%; 
      object-fit: contain; 
      cursor: pointer; 
      display: block; 
      transition: transform 0.3s ease;
    }
    .photo-card img:hover { transform: scale(1.03); }

    .btn-delete-admin { 
      display: none; 
      position: absolute; top: 10px; right: 10px;
      background: rgba(239, 68, 68, 0.85); color: white; border: none; 
      padding: 0.4rem 0.6rem; border-radius: 6px; cursor: pointer; z-index: 10;
      backdrop-filter: blur(4px);
    }
    .btn-delete-admin:hover { background: rgba(239, 68, 68, 1); }

    /* Number Order Input Overlay */
    .order-input-container {
      display: none;
      position: absolute; top: 10px; left: 10px;
      z-index: 15;
    }
    .order-input-container.active { display: block; }
    .order-input {
      width: 60px;
      padding: 0.3rem;
      background: rgba(15, 17, 21, 0.9);
      border: 2px solid var(--primary);
      color: white;
      font-weight: bold;
      text-align: center;
      border-radius: 6px;
      font-size: 1rem;
      outline: none;
    }

    .modal {
      display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8);
      backdrop-filter: blur(5px); justify-content: center; align-items: center; z-index: 1000;
    }
    .modal-content {
      background: var(--card-bg); border: 1px solid var(--border);
      padding: 2rem; border-radius: 12px; width: 100%; max-width: 440px;
    }
    .modal-content input {
      width: 100%; padding: 0.7rem; margin-top: 0.25rem; margin-bottom: 1rem;
      background: #0f1115; border: 1px solid var(--border); color: white; border-radius: 6px;
    }
    .modal-actions { display: flex; justify-content: flex-end; gap: 0.75rem; }

    #lightboxModal {
      background: rgba(0, 0, 0, 0.95);
      user-select: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }
    .lightbox-container {
      position: relative; width: 100%; height: 100%;
      display: flex; justify-content: center; align-items: center; overflow: hidden;
    }
    #lightboxImg {
      max-width: 85vw; max-height: 80vh; object-fit: contain;
      transition: transform 0.05s ease-out; cursor: grab; touch-action: none;
    }
    #lightboxImg:active { cursor: grabbing; }
    .lightbox-arrow {
      position: absolute; top: 50%; transform: translateY(-50%);
      background: rgba(255, 255, 255, 0.15); color: white; border: none;
      font-size: 2rem; padding: 0.5rem 1rem; cursor: pointer; border-radius: 50%;
      z-index: 1020; transition: background 0.2s;
    }
    .lightbox-arrow:hover { background: rgba(255, 255, 255, 0.3); }
    #lightboxPrev { left: 20px; }
    #lightboxNext { right: 20px; }
    .lightbox-bottom-bar { position: absolute; bottom: 20px; display: flex; gap: 1rem; z-index: 1020; }
  </style>
</head>
<body>

  <header>
    <div class="header-left"><div class="album-title">Leni & Jackson</div></div>
    <div class="brand-center">Memories For Ever</div>
    <div class="header-right">
      <button class="btn-admin" id="btnAdmin">
        Admin Panel
        <span class="sync-indicator-dot" id="syncDot" title="GitHub Connection Status"></span>
      </button>
    </div>
  </header>

  <main class="container">
    <!-- Home / Folder Grid View -->
    <div id="home-view" class="view-section" style="display: block;">
      <div class="banner-section">
        <div class="banner-slide active" style="background-image: url('family1.jpg');"></div>
        <div class="banner-slide" style="background-image: url('cover.jpg');"></div>
        <div class="banner-slide" style="background-image: url('family2.jpg');"></div>
        <div class="banner-slide" style="background-image: url('family3.jpg');"></div>
      </div>
      
      <div class="video-section">
        <iframe src="https://www.youtube.com/embed/gBmXWUkYXc0" 
                title="YouTube video player" 
                frameborder="0" 
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
                allowfullscreen>
        </iframe>
      </div>

      <div class="album-grid" id="folder-grid"></div>

      <!-- Centered Engagement Highlights Text Heading -->
      <div style="text-align: center; margin-top: 3rem; margin-bottom: 2rem;">
        <h2 style="font-family: 'Great Vibes', cursive; font-size: 3rem; color: var(--primary);">Engagement Highlights</h2>
      </div>
    </div>

    <!-- Gallery View -->
    <div id="gallery-view" class="view-section">
      <div class="view-header">
        <h2 class="folder-heading" id="current-folder-title">Folder</h2>
        <div class="action-bar">
          <button class="btn btn-secondary" onclick="goHome()">🏠 Home</button>
          <button class="btn btn-reorder-admin" id="btnReorderAdmin" onclick="toggleReorderMode()">↕ Rearrange</button>
          <button class="btn btn-upload-admin" id="btnUploadAdmin">Upload Photo</button>
        </div>
      </div>
      <div id="photo-grid" class="photo-grid"></div>
    </div>
  </main>

  <!-- Upload Modal -->
  <div id="addModal" class="modal">
    <div class="modal-content">
      <h3 style="margin-bottom: 1rem;">Upload Photos to GitHub</h3>
      <input type="file" id="fileInput" accept="image/*" multiple>
      <div class="modal-actions">
        <button class="btn btn-secondary" id="closeUploadModal">Cancel</button>
        <button class="btn btn-upload-admin" id="btnSubmitUpload" style="display:inline-block; width:auto;">Upload & Push</button>
      </div>
    </div>
  </div>

  <!-- Admin Settings Modal -->
  <div id="adminPanelModal" class="modal">
    <div class="modal-content">
      <h3 style="margin-bottom: 1rem;">GitHub Repository Sync</h3>
      <label style="font-size: 0.8rem; color: var(--text-muted);">Repository Username</label>
      <input type="text" id="ghOwner" placeholder="e.g. sethukrishnan7561">
      <label style="font-size: 0.8rem; color: var(--text-muted);">Repository Name</label>
      <input type="text" id="ghRepo" placeholder="e.g. WEDDING-SITE">
      <label style="font-size: 0.8rem; color: var(--text-muted);">Branch</label>
      <input type="text" id="ghBranch" value="main">
      <label style="font-size: 0.8rem; color: var(--text-muted);">Personal Access Token (PAT)</label>
      <input type="password" id="ghToken" placeholder="ghp_...">
      <div class="modal-actions">
        <button class="btn btn-secondary" id="closeAdminModal">Cancel</button>
        <button class="btn btn-upload-admin" id="saveAdminBtn" style="display:inline-block; width:auto;">Save & Connect</button>
      </div>
    </div>
  </div>

  <!-- Lightbox Image Viewer Modal -->
  <div id="lightboxModal" class="modal">
    <span onclick="closeLightbox()" style="position: absolute; top: 20px; right: 30px; font-size: 2.5rem; color: white; cursor: pointer; z-index: 1030;">&times;</span>
    
    <button class="lightbox-arrow" id="lightboxPrev" onclick="prevImage()">&#10094;</button>
    <button class="lightbox-arrow" id="lightboxNext" onclick="nextImage()">&#10095;</button>

    <div class="lightbox-container" id="lightboxContainer">
      <img id="lightboxImg" src="" alt="Zoomable Image">
    </div>

    <div class="lightbox-bottom-bar">
      <a id="lightboxDownloadBtn" href="" download class="btn btn-secondary" title="Download Image" style="padding: 0.5rem 1rem; font-size: 1.1rem; text-decoration: none; display: inline-flex; align-items: center;">📥 Download</a>
    </div>
  </div>

  <script>
    const DEFAULT_OWNER = "sethukrishnan7561";
    const DEFAULT_REPO = "WEDDING-SITE";
    const DEFAULT_BRANCH = "main";
    const SECRET_ADMIN_PASS = "admin2026";

    const slides = document.querySelectorAll('.banner-slide');
    let curSlide = 0;
    if (slides.length > 0) {
      setInterval(() => {
        slides[curSlide].classList.remove('active');
        curSlide = (curSlide + 1) % slides.length;
        slides[curSlide].classList.add('active');
      }, 4500);
    }

    const folders = [
      { id: "save-the-date", title: "Save the date", defaultCover: "https://images.unsplash.com/photo-1519741497674-611481863552?auto=format&fit=crop&w=800&q=80" },
      { id: "engagement", title: "Engagement", defaultCover: "https://images.unsplash.com/photo-1511285560929-80b456fea0bc?auto=format&fit=crop&w=800&q=80" },
      { id: "wedding", title: "Wedding", defaultCover: "https://images.unsplash.com/photo-1465495976277-4387d4b0b4c6?auto=format&fit=crop&w=800&q=80" }
    ];

    let currentFolderId = "";
    let isAdmin = false;
    let currentFiles = [];
    let currentIndex = 0;
    let isReorderMode = false;
    let globalCovers = {};

    let currentScale = 1;
    let panX = 0;
    let panY = 0;
    let activePointers = new Map();
    let initialPinchDistance = null;
    let initialPinchScale = 1;
    let isDragging = false;
    let startX = 0;
    let startY = 0;

    function checkAdminAccess() {
      const urlParams = new URLSearchParams(window.location.search);
      if (urlParams.get("key") === SECRET_ADMIN_PASS) {
        localStorage.setItem("admin_authorized", "true");
        window.history.replaceState({}, document.title, window.location.pathname);
      }

      if (localStorage.getItem("admin_authorized") === "true") {
        isAdmin = true;
        const btnAdmin = document.getElementById("btnAdmin");
        const btnUploadAdmin = document.getElementById("btnUploadAdmin");
        const btnReorderAdmin = document.getElementById("btnReorderAdmin");
        if (btnAdmin) btnAdmin.style.display = "inline-flex";
        if (btnUploadAdmin) btnUploadAdmin.style.display = "inline-block";
        if (btnReorderAdmin) btnReorderAdmin.style.display = "inline-block";
      }
    }

    document.addEventListener("DOMContentLoaded", async () => {
      checkAdminAccess();

      const btnAdmin = document.getElementById("btnAdmin");
      const adminModal = document.getElementById("adminPanelModal");
      const closeAdminModal = document.getElementById("closeAdminModal");
      const saveAdminBtn = document.getElementById("saveAdminBtn");

      if (btnAdmin) {
        btnAdmin.addEventListener("click", () => {
          adminModal.style.display = "flex";
          document.getElementById("ghOwner").value = localStorage.getItem("gh_owner") || DEFAULT_OWNER;
          document.getElementById("ghRepo").value = localStorage.getItem("gh_repo") || DEFAULT_REPO;
          document.getElementById("ghBranch").value = localStorage.getItem("gh_branch") || DEFAULT_BRANCH;
          document.getElementById("ghToken").value = localStorage.getItem("gh_token") || "";
        });
      }

      if (closeAdminModal) {
        closeAdminModal.addEventListener("click", () => { adminModal.style.display = "none"; });
      }

      if (saveAdminBtn) {
        saveAdminBtn.addEventListener("click", async () => {
          localStorage.setItem("gh_owner", document.getElementById("ghOwner").value.trim());
          localStorage.setItem("gh_repo", document.getElementById("ghRepo").value.trim());
          localStorage.setItem("gh_branch", document.getElementById("ghBranch").value.trim());
          localStorage.setItem("gh_token", document.getElementById("ghToken").value.trim());
          adminModal.style.display = "none";
          await checkHealth();
          await fetchGlobalCovers();
          renderFolders();
        });
      }

      const btnUploadAdmin = document.getElementById("btnUploadAdmin");
      const addModal = document.getElementById("addModal");
      const closeUploadModal = document.getElementById("closeUploadModal");
      const btnSubmitUpload = document.getElementById("btnSubmitUpload");

      if (btnUploadAdmin) {
        btnUploadAdmin.addEventListener("click", () => {
          document.getElementById("fileInput").value = "";
          addModal.style.display = "flex";
        });
      }
      if (closeUploadModal) {
        closeUploadModal.addEventListener("click", () => { addModal.style.display = "none"; });
      }
      if (btnSubmitUpload) {
        btnSubmitUpload.addEventListener("click", uploadPhotoToGitHub);
      }

      setupLightboxGestures();
      await checkHealth();
      await fetchGlobalCovers();
      await renderFolders();
    });

    async function checkHealth() {
      const owner = localStorage.getItem("gh_owner") || DEFAULT_OWNER;
      const repo = localStorage.getItem("gh_repo") || DEFAULT_REPO;
      const token = localStorage.getItem("gh_token");
      const dot = document.getElementById("syncDot");
      if (!dot) return;

      try {
        const headers = { "Accept": "application/vnd.github+json" };
        if (token) headers["Authorization"] = `token ${token}`;
        const res = await fetch(`https://api.github.com/repos/${owner}/${repo}`, { headers });
        if (res.ok) dot.classList.add("connected");
        else dot.classList.remove("connected");
      } catch (e) {
        dot.classList.remove("connected");
      }
    }

    async function fetchGlobalCovers() {
      const owner = localStorage.getItem("gh_owner") || DEFAULT_OWNER;
      const repo = localStorage.getItem("gh_repo") || DEFAULT_REPO;
      const branch = localStorage.getItem("gh_branch") || DEFAULT_BRANCH;
      const token = localStorage.getItem("gh_token");

      const headers = { "Accept": "application/vnd.github+json" };
      if (token) headers["Authorization"] = `token ${token}`;

      try {
        const res = await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/uploads/covers.json?ref=${branch}`, { headers });
        if (res.ok) {
          const data = await res.json();
          globalCovers = JSON.parse(atob(data.content));
        } else {
          globalCovers = {};
        }
      } catch (e) {
        globalCovers = {};
      }
    }

    async function fetchGitHubFolder(folderId) {
      const owner = localStorage.getItem("gh_owner") || DEFAULT_OWNER;
      const repo = localStorage.getItem("gh_repo") || DEFAULT_REPO;
      const branch = localStorage.getItem("gh_branch") || DEFAULT_BRANCH;
      const token = localStorage.getItem("gh_token");

      const headers = { "Accept": "application/vnd.github+json" };
      if (token) headers["Authorization"] = `token ${token}`;

      try {
        let customOrder = [];
        try {
          const orderRes = await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/uploads/${folderId}/order.json?ref=${branch}`, { headers });
          if (orderRes.ok) {
            const orderData = await orderRes.json();
            customOrder = JSON.parse(atob(orderData.content));
          }
        } catch (err) {}

        const url = `https://api.github.com/repos/${owner}/${repo}/contents/uploads/${folderId}?ref=${branch}`;
        const res = await fetch(url, { headers });
        if (!res.ok) return [];
        const files = await res.json();
        const imageFiles = files.filter(f => /\.(jpe?g|png|gif|webp)$/i.test(f.name));

        if (customOrder.length > 0) {
          imageFiles.sort((a, b) => {
            let indexA = customOrder.indexOf(a.name);
            let indexB = customOrder.indexOf(b.name);
            if (indexA === -1) indexA = 9999;
            if (indexB === -1) indexB = 9999;
            return indexA - indexB;
          });
        }

        return imageFiles;
      } catch (err) {
        console.error("Failed fetching GitHub folder:", err);
        return [];
      }
    }

    async function renderFolders() {
      const grid = document.getElementById("folder-grid");
      if (!grid) return;
      grid.innerHTML = "";

      for (const f of folders) {
        const files = await fetchGitHubFolder(f.id);
        
        let coverSrc = f.defaultCover;
        if (globalCovers[f.id]) {
          coverSrc = globalCovers[f.id];
        } else if (files.length > 0) {
          coverSrc = files[0].download_url;
        }

        const card = document.createElement("div");
        card.className = "album-card";
        card.innerHTML = `
          <div class="cover-container" onclick="openFolder('${f.id}', '${f.title}')">
            <img src="${coverSrc}" class="folder-cover-preview" alt="${f.title}">
          </div>
          <div class="card-content">
            <button class="btn-folder-title" onclick="openFolder('${f.id}', '${f.title}')">${f.title}</button>
            <button class="btn-cover-admin" style="${isAdmin ? 'display:block;' : 'display:none;'}" onclick="openFolderCoverSelector('${f.id}', '${f.title}')">🖼 Change Cover</button>
          </div>
        `;
        grid.appendChild(card);
      }
    }

    window.openFolder = async function(id, title) {
      currentFolderId = id;
      isReorderMode = false;
      document.getElementById("btnReorderAdmin").textContent = "↕ Rearrange";
      document.getElementById("current-folder-title").textContent = title;
      document.getElementById("home-view").style.display = "none";
      document.getElementById("gallery-view").style.display = "block";
      await renderPhotos();
    }

    window.goHome = function() {
      isReorderMode = false;
      document.getElementById("gallery-view").style.display = "none";
      document.getElementById("home-view").style.display = "block";
      renderFolders();
    }

    window.openFolderCoverSelector = async function(folderId, folderTitle) {
      currentFolderId = folderId;
      document.getElementById("current-folder-title").textContent = `${folderTitle} (Select Cover Photo)`;
      document.getElementById("home-view").style.display = "none";
      document.getElementById("gallery-view").style.display = "block";
      
      const grid = document.getElementById("photo-grid");
      if (!grid) return;
      grid.innerHTML = "<p style='color: var(--text-muted);'>Loading photos...</p>";

      currentFiles = await fetchGitHubFolder(folderId);
      grid.innerHTML = "";

      if (currentFiles.length === 0) {
        grid.innerHTML = "<p style='color: var(--text-muted); padding: 1.5rem 0;'>No photos found in this collection to use as a cover.</p>";
        return;
      }

      currentFiles.forEach((file) => {
        const card = document.createElement("div");
        card.className = "photo-card";
        card.innerHTML = `
          <img src="${file.download_url}" alt="${file.name}" title="Click to set as folder cover" onclick="setFolderCover('${file.download_url}')">
          <div style="position: absolute; bottom: 0; inset-x: 0; background: rgba(0,0,0,0.8); padding: 0.4rem; text-align: center; z-index: 15;">
            <button class="btn-folder-title" style="font-size: 1.2rem; padding: 0.3rem;" onclick="setFolderCover('${file.download_url}')">Set as Cover</button>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    window.setFolderCover = async function(imageUrl) {
      const token = localStorage.getItem("gh_token");
      const owner = localStorage.getItem("gh_owner") || DEFAULT_OWNER;
      const repo = localStorage.getItem("gh_repo") || DEFAULT_REPO;
      const branch = localStorage.getItem("gh_branch") || DEFAULT_BRANCH;

      if (!token) {
        alert("Please set your GitHub token in Admin Panel to save custom covers!");
        return;
      }

      globalCovers[currentFolderId] = imageUrl;

      const path = `uploads/covers.json`;
      const url = `https://api.github.com/repos/${owner}/${repo}/contents/${path}`;
      const headers = { "Accept": "application/vnd.github+json", "Authorization": `token ${token.trim()}` };

      let existingSha = null;
      try {
        const checkRes = await fetch(url, { headers });
        if (checkRes.ok) {
          const fileData = await checkRes.json();
          existingSha = fileData.sha;
        }
      } catch (e) {}

      const base64Content = btoa(JSON.stringify(globalCovers, null, 2));

      try {
        const bodyData = {
          message: `Update folder cover for ${currentFolderId}`,
          content: base64Content,
          branch: branch
        };
        if (existingSha) bodyData.sha = existingSha;

        const res = await fetch(url, {
          method: "PUT",
          headers: { ...headers, "Content-Type": "application/json" },
          body: JSON.stringify(bodyData)
        });

        if (res.ok) {
          alert("Folder cover successfully updated and saved to GitHub!");
          goHome();
        } else {
          const err = await res.json();
          alert("Failed to update cover: " + err.message);
        }
      } catch (err) {
        alert("Error updating cover: " + err.message);
      }
    }

    window.toggleReorderMode = function() {
      if (!isReorderMode) {
        isReorderMode = true;
        document.getElementById("btnReorderAdmin").textContent = "💾 Save Order";
        renderPhotos();
      } else {
        const inputs = document.querySelectorAll('.order-input');
        let orderPairs = [];
        inputs.forEach(input => {
          const idx = parseInt(input.dataset.index);
          const val = parseInt(input.value) || 999;
          orderPairs.push({ file: currentFiles[idx], order: val });
        });

        orderPairs.sort((a, b) => a.order - b.order);
        currentFiles = orderPairs.map(p => p.file);

        isReorderMode = false;
        document.getElementById("btnReorderAdmin").textContent = "↕ Rearrange";
        saveOrderToGitHub();
      }
    }

    async function renderPhotos() {
      const grid = document.getElementById("photo-grid");
      if (!grid) return;
      grid.innerHTML = "<p style='color: var(--text-muted);'>Loading memories...</p>";

      if (!isReorderMode) {
        currentFiles = await fetchGitHubFolder(currentFolderId);
      }
      grid.innerHTML = "";

      if (currentFiles.length === 0) {
        grid.innerHTML = "<p style='color: var(--text-muted); padding: 1.5rem 0;'>No photos found in this collection.</p>";
        return;
      }

      currentFiles.forEach((file, index) => {
        const card = document.createElement("div");
        card.className = "photo-card";
        card.innerHTML = `
          <div class="order-input-container ${isReorderMode ? 'active' : ''}">
            <input type="number" class="order-input" data-index="${index}" value="" min="1">
          </div>
          <img src="${file.download_url}" alt="${file.name}" onclick="${isReorderMode ? '' : `openLightbox(${index})`}">
          <button class="btn-delete-admin" style="${isAdmin && !isReorderMode ? 'display:block;' : 'display:none;'}" onclick="deletePhotoFromGitHub('${file.path}', '${file.sha}')">🗑</button>
        `;
        grid.appendChild(card);
      });
    }

    async function saveOrderToGitHub() {
      const token = localStorage.getItem("gh_token");
      const owner = localStorage.getItem("gh_owner") || DEFAULT_OWNER;
      const repo = localStorage.getItem("gh_repo") || DEFAULT_REPO;
      const branch = localStorage.getItem("gh_branch") || DEFAULT_BRANCH;

      if (!token) {
        alert("Please set your GitHub token in Admin Panel to save custom sorting order!");
        renderPhotos();
        return;
      }

      const orderList = currentFiles.map(f => f.name);
      const path = `uploads/${currentFolderId}/order.json`;
      const url = `https://api.github.com/repos/${owner}/${repo}/contents/${path}`;
      const headers = { "Accept": "application/vnd.github+json", "Authorization": `token ${token.trim()}` };

      let existingSha = null;
      try {
        const checkRes = await fetch(url, { headers });
        if (checkRes.ok) {
          const fileData = await checkRes.json();
          existingSha = fileData.sha;
        }
      } catch (e) {}

      const base64Content = btoa(JSON.stringify(orderList, null, 2));

      try {
        const bodyData = {
          message: `Update display order for ${currentFolderId}`,
          content: base64Content,
          branch: branch
        };
        if (existingSha) bodyData.sha = existingSha;

        const res = await fetch(url, {
          method: "PUT",
          headers: { ...headers, "Content-Type": "application/json" },
          body: JSON.stringify(bodyData)
        });

        if (res.ok) {
          alert("New photo order successfully saved and pushed to GitHub!");
        } else {
          const err = await res.json();
          alert("Failed to save order: " + err.message);
        }
      } catch (err) {
        alert("Error saving order: " + err.message);
      }
      renderPhotos();
    }

    window.openLightbox = function(index) {
      currentIndex = index;
      document.getElementById("lightboxModal").style.display = "flex";
      loadCurrentImage();
    }

    window.closeLightbox = function() {
      document.getElementById("lightboxModal").style.display = "none";
    }

    function loadCurrentImage() {
      const file = currentFiles[currentIndex];
      const img = document.getElementById("lightboxImg");
      const downloadBtn = document.getElementById("lightboxDownloadBtn");

      currentScale = 1; panX = 0; panY = 0;
      activePointers.clear();
      updateImageTransform();

      img.src = file.download_url;
      downloadBtn.href = file.download_url;
      downloadBtn.setAttribute("download", file.name);
    }

    window.nextImage = function() {
      if (currentFiles.length === 0) return;
      currentIndex = (currentIndex + 1) % currentFiles.length;
      loadCurrentImage();
    }

    window.prevImage = function() {
      if (currentFiles.length === 0) return;
      currentIndex = (currentIndex - 1 + currentFiles.length) % currentFiles.length;
      loadCurrentImage();
    }

    function updateImageTransform() {
      const img = document.getElementById("lightboxImg");
      img.style.transform = `translate(${panX}px, ${panY}px) scale(${currentScale})`;
    }

    function setupLightboxGestures() {
      const img = document.getElementById("lightboxImg");
      const container = document.getElementById("lightboxContainer");

      container.addEventListener("wheel", (e) => {
        e.preventDefault();
        const zoomIntensity = 0.15;
        if (e.deltaY < 0) currentScale = Math.min(currentScale + zoomIntensity, 5);
        else {
          currentScale = Math.max(currentScale - zoomIntensity, 1);
          if (currentScale === 1) { panX = 0; panY = 0; }
        }
        updateImageTransform();
      }, { passive: false });

      let touchStartX = 0;
      let touchEndX = 0;

      container.addEventListener("pointerdown", (e) => {
        if (e.target.tagName !== "IMG") return;
        activePointers.set(e.pointerId, e);
        img.setPointerCapture(e.pointerId);

        if (activePointers.size === 1) {
          isDragging = true;
          startX = e.clientX - panX;
          startY = e.clientY - panY;
          touchStartX = e.clientX;
        } else if (activePointers.size === 2) {
          isDragging = false;
          const pointers = Array.from(activePointers.values());
          initialPinchDistance = Math.hypot(pointers[0].clientX - pointers[1].clientX, pointers[0].clientY - pointers[1].clientY);
          initialPinchScale = currentScale;
        }
      });

      container.addEventListener("pointermove", (e) => {
        if (!activePointers.has(e.pointerId)) return;
        activePointers.set(e.pointerId, e);

        if (activePointers.size === 2 && initialPinchDistance !== null) {
          const pointers = Array.from(activePointers.values());
          const currentDistance = Math.hypot(pointers[0].clientX - pointers[1].clientX, pointers[0].clientY - pointers[1].clientY);
          const scaleFactor = currentDistance / initialPinchDistance;
          currentScale = Math.min(Math.max(initialPinchScale * scaleFactor, 1), 5);
          if (currentScale === 1) { panX = 0; panY = 0; }
          updateImageTransform();
        } else if (activePointers.size === 1 && isDragging) {
          if (currentScale > 1) {
            panX = e.clientX - startX;
            panY = e.clientY - startY;
            updateImageTransform();
          }
        }
      });

      const handlePointerUp = (e) => {
        if (!activePointers.has(e.pointerId)) return;
        activePointers.delete(e.pointerId);

        if (activePointers.size < 2) {
          initialPinchDistance = null;
        }

        if (activePointers.size === 1) {
          const remainingPointer = Array.from(activePointers.values())[0];
          isDragging = true;
          startX = remainingPointer.clientX - panX;
          startY = remainingPointer.clientY - panY;
        } else if (activePointers.size === 0) {
          if (isDragging) {
            isDragging = false;
            touchEndX = e.clientX;
            if (currentScale === 1) {
              if (touchStartX - touchEndX > 50) nextImage();
              else if (touchEndX - touchStartX > 50) prevImage();
            }
          }
        }
      };

      container.addEventListener("pointerup", handlePointerUp);
      container.addEventListener("pointercancel", handlePointerUp);
    }

    function fileToBase64(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result.split(",")[1]);
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    async function uploadPhotoToGitHub() {
      const token = localStorage.getItem("gh_token");
      const owner = localStorage.getItem("gh_owner") || DEFAULT_OWNER;
      const repo = localStorage.getItem("gh_repo") || DEFAULT_REPO;
      const branch = localStorage.getItem("gh_branch") || DEFAULT_BRANCH;

      if (!token) {
        alert("Please open Admin Panel and enter your GitHub PAT token first!");
        return;
      }

      const files = document.getElementById("fileInput").files;
      if (files.length === 0) { alert("Please select at least one image file."); return; }

      const btn = document.getElementById("btnSubmitUpload");
      btn.disabled = true;
      let successCount = 0;

      for (let i = 0; i < files.length; i++) {
        const file = files[i];
        btn.innerText = `Uploading (${i + 1}/${files.length})...`;

        try {
          const base64 = await fileToBase64(file);
          const filename = `${Date.now()}_${file.name.replace(/\s+/g, "_")}`;
          const path = `uploads/${currentFolderId}/${filename}`;
          const url = `https://api.github.com/repos/${owner}/${repo}/contents/${path}`;

          const res = await fetch(url, {
            method: "PUT",
            headers: { "Accept": "application/vnd.github+json", "Authorization": `token ${token.trim()}`, "Content-Type": "application/json" },
            body: JSON.stringify({ message: `Add ${filename} via Admin Panel`, content: base64, branch: branch })
          });

          if (res.ok) successCount++;
        } catch (err) {}
      }

      btn.innerText = "Upload & Push";
      btn.disabled = false;
      document.getElementById("addModal").style.display = "none";
      alert(`Successfully uploaded ${successCount} of ${files.length} photos!`);
      await renderPhotos();
    }

    window.deletePhotoFromGitHub = async function(path, sha) {
      const token = localStorage.getItem("gh_token");
      const owner = localStorage.getItem("gh_owner") || DEFAULT_OWNER;
      const repo = localStorage.getItem("gh_repo") || DEFAULT_REPO;
      const branch = localStorage.getItem("gh_branch") || DEFAULT_BRANCH;

      if (!token) { alert("Unauthorized. Set your token in Admin Panel."); return; }
      if (!confirm("Are you sure you want to permanently delete this photo from GitHub?")) return;

      try {
        const url = `https://api.github.com/repos/${owner}/${repo}/contents/${path}`;
        const res = await fetch(url, {
          method: "DELETE",
          headers: { "Accept": "application/vnd.github+json", "Authorization": `token ${token.trim()}`, "Content-Type": "application/json" },
          body: JSON.stringify({ message: `Delete ${path} via Admin Panel`, sha: sha, branch: branch })
        });

        if (res.ok) {
          alert("Photo deleted from repository.");
          await renderPhotos();
        } else {
          const err = await res.json();
          alert("Delete failed: " + err.message);
        }
      } catch (err) {
        alert("Error: " + err.message);
      }
    }
  </script>
