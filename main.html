<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title> Leni & Jackson </title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #0b0b0b;
      color: #ffffff;
      font-family: 'Inter', sans-serif;
      overflow-x: hidden;
    }

    /* Header & Navigation */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1.5rem 2.5rem;
      position: sticky;
      top: 0;
      z-index: 100;
      background-color: rgba(11, 11, 11, 0.95);
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }

    .brand {
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: 1px;
      color: #fff;
      text-decoration: none;
    }

    nav ul {
      display: flex;
      list-style: none;
      gap: 1.75rem;
      align-items: center;
    }

    nav a {
      text-decoration: none;
      color: #a0a0a0;
      font-size: 0.9rem;
      transition: color 0.2s ease;
    }

    nav a:hover,
    nav a.active {
      color: #ffffff;
    }

    .social-links {
      display: flex;
      gap: 1.25rem;
      align-items: center;
    }

    .social-links a {
      color: #a0a0a0;
      font-size: 0.95rem;
      text-decoration: none;
      transition: color 0.2s ease;
    }

    .social-links a:hover {
      color: #ffffff;
    }

    /* Grid Gallery */
    .gallery-container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 2.5rem 1.5rem;
    }

    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 1.5rem;
    }

    .gallery-card {
      position: relative;
      height: 420px;
      overflow: hidden;
      border-radius: 4px;
      background-color: #1a1a1a;
    }

    .gallery-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.5s ease, filter 0.5s ease;
      filter: grayscale(100%);
    }

    .gallery-card:hover img {
      transform: scale(1.05);
      filter: grayscale(0%);
    }

    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.45);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 1rem;
      transition: background 0.3s ease;
    }

    .gallery-card:hover .overlay {
      background: rgba(0, 0, 0, 0.25);
    }

    .overlay h2 {
      font-size: 1.85rem;
      font-weight: 600;
      letter-spacing: 1px;
      margin-bottom: 1.25rem;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.6);
    }

    .btn-more {
      display: inline-block;
      padding: 0.65rem 1.4rem;
      border: 1px solid rgba(255, 255, 255, 0.8);
      color: #ffffff;
      text-decoration: none;
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 2px;
      text-transform: uppercase;
      transition: all 0.25s ease;
    }

    .btn-more:hover {
      background-color: #ffffff;
      color: #0b0b0b;
    }

    /* Footer */
    footer {
      text-align: center;
      padding: 3rem 1rem;
      font-size: 0.8rem;
      color: #666;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
    }

    footer a {
      color: #999;
      text-decoration: none;
    }

    footer a:hover {
      color: #fff;
    }

    /* Responsive */
    @media (max-width: 768px) {
      header {
        flex-direction: column;
        gap: 1rem;
        padding: 1.5rem 1rem;
      }

      nav ul {
        flex-wrap: wrap;
        justify-content: center;
        gap: 1rem;
      }
    }
  </style>
</head>
<body>

  <!-- Navigation Bar -->
  <header>
    <a href="#" class="brand">Leni Jackson </a>
    <nav>
      <ul>
        <li><a href="#" class="active">Home</a></li>
        <li><a href="#">Gallery</a></li>
      </ul>
    </nav>
  </header>

  <!-- Gallery Section -->
  <main class="gallery-container">
    <div class="gallery-grid">
      
      <div class="gallery-card">
        <img src="https://images.unsplash.com/photo-1470071459604-3b5ec3a7fe05?auto=format&fit=crop&w=800&q=80" alt="Nature">
        <div class="overlay">
          <h2>Highlights</h2>
          <a href="Highlights.html" class="btn-more">View Photos</a>
        </div>
      </div>

      <div class="gallery-card">
        <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=800&q=80" alt="Portrait">
        <div class="overlay">
          <h2>Save The Date</h2>
          <a href="#" class="btn-more">view Photos</a>
        </div>
      </div>

      <div class="gallery-card">
        <img src="https://images.unsplash.com/photo-1511632765486-a01980e01a18?auto=format&fit=crop&w=800&q=80" alt="People">
        <div class="overlay">
          <h2>Engagement</h2>
          <a href="#" class="btn-more">view Photos</a>
        </div>
      </div>

      <div class="gallery-card">
        <img src="https://images.unsplash.com/photo-1486406146926-c627a92ad1ab?auto=format&fit=crop&w=800&q=80" alt="Architecture">
        <div class="overlay">
          <h2>Wedding</h2>
          <a href="#" class="btn-more">More Photos</a>
        </div>
      </div>
  </main>

  <!-- Footer -->
  <footer>
    <p>Copyright &copy; 2026 All rights reserved </p>
  </footer>

</body>
</html>
