<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Leni & Jackson </title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,400&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #0d0f12;
      color: #ffffff;
      font-family: 'Cormorant Garamond', serif;
      overflow-x: hidden;
    }

    .hero-container {
      position: relative;
      width: 100vw;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* Background photo with subtle dark gradient vignette */
    .hero-bg {
      position: absolute;
      inset: 0;
      background: 
        radial-gradient(circle at center, rgba(15, 12, 10, 0.15) 0%, rgba(10, 8, 8, 0.7) 100%),
        url('cover.jpg') center/cover no-repeat;
      z-index: 1;
      transform: scale(1.02);
      transition: transform 6s ease-out;
    }

    .hero-container:hover .hero-bg {
      transform: scale(1.05);
    }

    /* Botanical corners using SVG */
    .corner-vine {
      position: absolute;
      width: 120px;
      height: 120px;
      stroke: rgba(255, 255, 255, 0.85);
      stroke-width: 1.5;
      fill: none;
      z-index: 4;
      pointer-events: none;
      filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.4));
    }

    .corner-tl { top: 10px; left: 10px; }
    .corner-tr { top: 10px; right: 10px; transform: scaleX(-1); }
    .corner-bl { bottom: 10px; left: 10px; transform: scaleY(-1); }
    .corner-br { bottom: 10px; right: 10px; transform: scale(-1, -1); }

    /* Elegant framing border */
    .inner-border {
      position: absolute;
      inset: 32px;
      border: 1px solid rgba(255, 255, 255, 0.25);
      z-index: 3;
      pointer-events: none;
    }

    .sparkle {
      position: absolute;
      color: rgba(255, 255, 255, 0.9);
      font-size: 14px;
      user-select: none;
      animation: pulse 3s infinite ease-in-out;
    }

   

    /* Floating names on left & right resembling the photo composition */
    .name-left, .name-right {
      position: absolute;
      z-index: 5;
      font-family: 'Alex Brush', cursive;
      font-size: clamp(3.8rem, 8vw, 7.5rem);
      color: #ffffff;
      text-shadow: 0 4px 18px rgba(0, 0, 0, 0.65), 0 2px 6px rgba(0, 0, 0, 0.4);
      letter-spacing: 2px;
      user-select: none;
    }

    .name-left {
      left: 7%;
      top: 48%;
      transform: translateY(-50%);
    }

    .name-right {
      right: 7%;
      top: 48%;
      transform: translateY(-50%);
    }

    /* Top and bottom ceremony details */
    .header-details {
      position: absolute;
      top: 60px;
      z-index: 5;
      text-align: center;
      width: 100%;
    }

    .header-details .subtitle {
      font-family: 'Montserrat', sans-serif;
      font-size: 0.85rem;
      letter-spacing: 0.45em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.9);
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.6);
    }

    .footer-details {
      position: absolute;
      bottom: 55px;
      z-index: 5;
      text-align: center;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
    }

    .wedding-date {
      font-size: 1.5rem;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: #fff;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.7);
    }

    .cta-button {
      display: inline-block;
      padding: 11px 32px;
      font-family: 'Montserrat', sans-serif;
      font-size: 0.75rem;
      font-weight: 500;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      text-decoration: none;
      color: #ffffff;
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.55);
      border-radius: 40px;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      transition: all 0.3s ease;
    }

    .cta-button:hover {
      background: #ffffff;
      color: #1a1a1a;
      box-shadow: 0 6px 20px rgba(255, 255, 255, 0.3);
      transform: translateY(-2px);
    }

    @media (max-width: 768px) {
      .name-left {
        left: 5%;
        top: 38%;
      }
      .name-right {
        right: 5%;
        top: 54%;
      }
      .inner-border {
        inset: 16px;
      }
      .corner-vine {
        width: 80px;
        height: 80px;
      }
      .wedding-date {
        font-size: 1.2rem;
        letter-spacing: 0.18em;
      }
    }
  </style>
</head>
<body>

  <section class="hero-container">
    <div class="hero-bg"></div>
    <div class="inner-border"></div>

    <!-- Hand-drawn style SVG botanical corners -->
    <svg class="corner-vine corner-tl" viewBox="0 0 100 100">
      <path d="M 6 6 Q 30 15 50 45 T 75 90" stroke-linecap="round"/>
      <circle cx="18" cy="11" r="2.5" fill="white"/>
      <circle cx="34" cy="22" r="3" fill="white"/>
      <circle cx="46" cy="38" r="3.5" fill="white"/>
      <circle cx="62" cy="62" r="4" fill="white"/>
      <path d="M 12 8 Q 16 2 22 5 Q 18 12 12 8 Z" fill="rgba(255,255,255,0.7)"/>
      <path d="M 30 18 Q 36 12 42 16 Q 37 24 30 18 Z" fill="rgba(255,255,255,0.7)"/>
      <path d="M 44 32 Q 52 28 56 34 Q 49 42 44 32 Z" fill="rgba(255,255,255,0.7)"/>
    </svg>

    <svg class="corner-vine corner-tr" viewBox="0 0 100 100">
      <path d="M 6 6 Q 30 15 50 45 T 75 90" stroke-linecap="round"/>
      <circle cx="18" cy="11" r="2.5" fill="white"/>
      <circle cx="34" cy="22" r="3" fill="white"/>
      <circle cx="46" cy="38" r="3.5" fill="white"/>
      <circle cx="62" cy="62" r="4" fill="white"/>
      <path d="M 12 8 Q 16 2 22 5 Q 18 12 12 8 Z" fill="rgba(255,255,255,0.7)"/>
      <path d="M 30 18 Q 36 12 42 16 Q 37 24 30 18 Z" fill="rgba(255,255,255,0.7)"/>
      <path d="M 44 32 Q 52 28 56 34 Q 49 42 44 32 Z" fill="rgba(255,255,255,0.7)"/>
    </svg>

    <svg class="corner-vine corner-bl" viewBox="0 0 100 100">
      <path d="M 6 6 Q 30 15 50 45 T 75 90" stroke-linecap="round"/>
      <circle cx="18" cy="11" r="2.5" fill="white"/>
      <circle cx="34" cy="22" r="3" fill="white"/>
      <circle cx="46" cy="38" r="3.5" fill="white"/>
      <circle cx="62" cy="62" r="4" fill="white"/>
      <path d="M 12 8 Q 16 2 22 5 Q 18 12 12 8 Z" fill="rgba(255,255,255,0.7)"/>
      <path d="M 30 18 Q 36 12 42 16 Q 37 24 30 18 Z" fill="rgba(255,255,255,0.7)"/>
      <path d="M 44 32 Q 52 28 56 34 Q 49 42 44 32 Z" fill="rgba(255,255,255,0.7)"/>
    </svg>

    <svg class="corner-vine corner-br" viewBox="0 0 100 100">
      <path d="M 6 6 Q 30 15 50 45 T 75 90" stroke-linecap="round"/>
      <circle cx="18" cy="11" r="2.5" fill="white"/>
      <circle cx="34" cy="22" r="3" fill="white"/>
      <circle cx="46" cy="38" r="3.5" fill="white"/>
      <circle cx="62" cy="62" r="4" fill="white"/>
      <path d="M 12 8 Q 16 2 22 5 Q 18 12 12 8 Z" fill="rgba(255,255,255,0.7)"/>
      <path d="M 30 18 Q 36 12 42 16 Q 37 24 30 18 Z" fill="rgba(255,255,255,0.7)"/>
      <path d="M 44 32 Q 52 28 56 34 Q 49 42 44 32 Z" fill="rgba(255,255,255,0.7)"/>
    </svg>

    <!-- Sparkle Accents -->
    <div class="sparkle" style="top: 15%; right: 28%;">✦</div>
    <div class="sparkle" style="bottom: 22%; left: 32%; animation-delay: 1.5s;">✦</div>

    <!-- Top Label -->
    <header class="header-details">
      <p class="subtitle">Together Forever</p>
    </header>

    <!-- Names matching the photo layout -->
    <div class="name-left">Leni</div>
    <div class="name-right">Jackson</div>

    <!-- Bottom Date & RSVP Action -->
    <footer class="footer-details">
      <a href="#rsvp" class="cta-button">Search Memories</a>
    </footer>
  </section>

</body>
</html>
