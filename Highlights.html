<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portrait Gallery — Photosen</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #0b0b0b;
      color: #ffffff;
      font-family: 'Inter', sans-serif;
      overflow-x: hidden;
      line-height: 1.6;
    }

    /* --- Navigation Bar --- */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1.5rem 3rem;
      position: sticky;
      top: 0;
      z-index: 100;
      background-color: rgba(11, 11, 11, 0.95);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }

    .brand {
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: 0.5px;
      color: #ffffff;
      text-decoration: none;
    }

    .nav-desktop {
      display: flex;
      align-items: center;
      gap: 2rem;
    }

    nav ul {
      display: flex;
      list-style: none;
      gap: 1.75rem;
      align-items: center;
    }

    nav a {
      text-decoration: none;
      color: #9e9e9e;
      font-size: 0.9rem;
      font-weight: 400;
      transition: color 0.2s ease;
    }

    nav a:hover,
    nav a.active {
      color: #ffffff;
    }

    .dropdown {
      position: relative;
    }

    .dropdown > a i {
      font-size: 0.7rem;
      margin-left: 0.25rem;
    }

    .social-links {
      display: flex;
      gap: 1.25rem;
      align-items: center;
    }

    .social-links a {
      color: #888888;
      font-size: 0.9rem;
      text-decoration: none;
      transition: color 0.2s ease;
    }

    .social-links a:hover {
      color: #ffffff;
    }

    /* Mobile Menu Toggle */
    .menu-toggle {
      display: none;
      background: none;
      border: none;
      color: #ffffff;
      font-size: 1.5rem;
      cursor: pointer;
    }

    /* Mobile Drawer */
    .mobile-drawer {
      position: fixed;
      top: 0;
      right: -280px;
      width: 280px;
      height: 100vh;
      background-color: #121212;
      z-index: 200;
      padding: 2.5rem 1.5rem;
      box-shadow: -5px 0 25px rgba(0, 0, 0, 0.8);
      transition: right 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      display: flex;
      flex-direction: column;
      gap: 2rem;
    }

    .mobile-drawer.open {
      right: 0;
    }

    .drawer-close {
      align-self: flex-end;
      background: none;
      border: none;
      color: #aaa;
      font-size: 1.4rem;
      cursor: pointer;
    }

    .drawer-nav ul {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }

    .drawer-nav a {
      color: #ccc;
      text-decoration: none;
      font-size: 1rem;
      font-weight: 500;
    }

    .drawer-nav a.active,
    .drawer-nav a:hover {
      color: #fff;
    }

    .drawer-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.6);
      z-index: 150;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .drawer-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    /* --- Page Title Header --- */
    .gallery-header {
      text-align: center;
      padding: 4rem 1.5rem 2.5rem;
    }

    .gallery-header h1 {
      font-size: 2.5rem;
      font-weight: 400;
      letter-spacing: 0.5px;
    }

    /* --- Gallery Grid Layout --- */
    .gallery-container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 0 1.5rem 5rem;
    }

    .photo-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1.5rem;
    }

    .photo-item {
      position: relative;
      overflow: hidden;
      background-color: #1a1a1a;
      aspect-ratio: 4 / 3;
      border-radius: 2px;
    }

    .photo-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      filter: grayscale(100%);
      transition: transform 0.4s ease, filter 0.4s ease;
    }

    .photo-item:hover img {
      transform: scale(1.06);
      filter: grayscale(0%);
    }

    /* --- Footer --- */
    footer {
      text-align: center;
      padding: 3rem 1rem;
      font-size: 0.85rem;
      color: #666666;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
    }

    footer a {
      color: #888888;
      text-decoration: none;
    }

    footer a:hover {
      color: #ffffff;
    }

    footer .fa-heart {
      color: #e02424;
      font-size: 0.8rem;
    }

    /* Responsive Queries */
    @media (max-width: 900px) {
      .nav-desktop,
      .social-links {
        display: none;
      }

      .menu-toggle {
        display: block;
      }

      header {
        padding: 1.25rem 1.5rem;
      }

      .gallery-header h1 {
        font-size: 1.85rem;
      }

      .photo-grid {
        grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
        gap: 1rem;
      }
    }
  </style>
</head>
<body>

  <!-- Navigation -->
  <header>
    <a href="#" class="brand">Photosen</a>

    <div class="nav-desktop">
      <nav>
        <ul>
          <li><a href="#">Home</a></li>
          <li class="dropdown"><a href="#" class="active">Gallery <i class="fa-solid fa-chevron-down"></i></a></li>
          <li><a href="#">Services</a></li>
          <li><a href="#">About</a></li>
          <li><a href="#">Contact</a></li>
        </ul>
      </nav>

      <div class="social-links">
        <a href="#" aria-label="Facebook"><i class="fa-brands fa-facebook-f"></i></a>
        <a href="#" aria-label="X"><i class="fa-brands fa-x-twitter"></i></a>
        <a href="#" aria-label="Instagram"><i class="fa-brands fa-instagram"></i></a>
        <a href="#" aria-label="YouTube"><i class="fa-brands fa-youtube"></i></a>
      </div>
    </div>

    <!-- Mobile Menu Button -->
    <button class="menu-toggle" id="menuToggle" aria-label="Open menu">
      <i class="fa-solid fa-bars"></i>
    </button>
  </header>

  <!-- Mobile Drawer Menu -->
  <div class="drawer-overlay" id="drawerOverlay"></div>
  <aside class="mobile-drawer" id="mobileDrawer">
    <button class="drawer-close" id="drawerClose" aria-label="Close menu">
      <i class="fa-solid fa-xmark"></i>
    </button>
    <div class="drawer-nav">
      <ul>
        <li><a href="#">Home</a></li>
        <li><a href="#" class="active">Gallery</a></li>
        <li><a href="#">Services</a></li>
        <li><a href="#">About</a></li>
        <li><a href="#">Contact</a></li>
      </ul>
    </div>
    <div class="social-links" style="display: flex;">
      <a href="#"><i class="fa-brands fa-facebook-f"></i></a>
      <a href="#"><i class="fa-brands fa-x-twitter"></i></a>
      <a href="#"><i class="fa-brands fa-instagram"></i></a>
      <a href="#"><i class="fa-brands fa-youtube"></i></a>
    </div>
  </aside>

  <!-- Page Title -->
  <section class="gallery-header">
    <h1>Portrait Gallery</h1>
  </section>

  <!-- Image Grid -->
  <main class="gallery-container">
    <div class="photo-grid">
      <div class="photo-item"><img src="https://images.unsplash.com/photo-1511497584788-87676104235f?auto=format&fit=crop&w=800&q=80" alt="Misty Forest"></div>
      <div class="photo-item"><img src="https://images.unsplash.com/photo-1448375240586-882707db888b?auto=format&fit=crop&w=800&q=80" alt="Dense Woods"></div>
      <div class="photo-item"><img src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=800&q=80" alt="Coastline"></div>
      <div class="photo-item"><img src="https://images.unsplash.com/photo-1473448912268-2022ce9509d8?auto=format&fit=crop&w=800&q=80" alt="Sunlight Through Trees"></div>
      <div class="photo-item"><img src="https://images.unsplash.com/photo-1518495973542-4542c06a5843?auto=format&fit=crop&w=800&q=80" alt="Tall Canopy"></div>
      <div class="photo-item"><img src="https://images.unsplash.com/photo-1441974231531-c6227db76b6e?auto=format&fit=crop&w=800&q=80" alt="Forest Trail"></div>
      <div class="photo-item"><img src="https://images.unsplash.com/photo-1506744038136-46273834b3fb?auto=format&fit=crop&w=800&q=80" alt="Yosemite Valley"></div>
      <div class="photo-item"><img src="https://images.unsplash.com/photo-1469474968028-56623f02e42e?auto=format&fit=crop&w=800&q=80" alt="Mountain Pass"></div>
      <div class="photo-item"><img src="https://images.unsplash.com/photo-1426604966848-d7adac402bff?auto=format&fit=crop&w=800&q=80" alt="Alpine Vista"></div>
      <div class="photo-item"><img src="https://images.unsplash.com/photo-1501785888041-af3ef285b470?auto=format&fit=crop&w=800&q=80" alt="Lake Shore"></div>
      <div class="photo-item"><img src="https://images.unsplash.com/photo-1472214103451-9374bd1c798e?auto=format&fit=crop&w=800&q=80" alt="Rolling Hills"></div>
      <div class="photo-item"><img src="https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?auto=format&fit=crop&w=800&q=80" alt="Jagged Peaks"></div>
    </div>
  </main>

  <!-- Footer -->
  <footer>
    <p>Copyright &copy; 2026 All rights reserved | This template is made with <i class="fa-solid fa-heart"></i> by <a href="https://colorlib.com" target="_blank" rel="noopener">Colorlib</a></p>
  </footer>

  <script>
    const menuToggle = document.getElementById('menuToggle');
    const drawerClose = document.getElementById('drawerClose');
    const mobileDrawer = document.getElementById('mobileDrawer');
    const drawerOverlay = document.getElementById('drawerOverlay');

    function toggleMenu(show) {
      if (show) {
        mobileDrawer.classList.add('open');
        drawerOverlay.classList.add('active');
        document.body.style.overflow = 'hidden';
      } else {
        mobileDrawer.classList.remove('open');
        drawerOverlay.classList.remove('active');
        document.body.style.overflow = '';
      }
    }

    menuToggle.addEventListener('click', () => toggleMenu(true));
    drawerClose.addEventListener('click', () => toggleMenu(false));
    drawerOverlay.addEventListener('click', () => toggleMenu(false));
  </script>

</body>
</html>
